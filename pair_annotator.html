<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>话术微调标注工具</title>
    <style>
        :root {
            --primary: #4f46e5;
            --border: #e5e7eb;
            --bg: #f9fafb;
            --card: #ffffff;
            --text: #111827;
            --text2: #6b7280;
            --user: #2563eb;
            --asst: #059669;
            --warn: #f59e0b;
            --modified-bg: #fffbeb;
        }

        * {
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            gap: .8rem;
            padding: .55rem 1rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.05rem;
            white-space: nowrap;
        }

        #progressText {
            flex: 1;
            font-size: .85rem;
            color: var(--text2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        button {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: .42rem .9rem;
            cursor: pointer;
            font-size: .85rem;
            white-space: nowrap;
        }

        button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        button.link {
            background: none;
            color: var(--primary);
            padding: 0;
            font-size: .78rem;
        }

        button.secondary {
            background: #fff;
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* 通用弹窗样式 */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .35);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal-mask[hidden] {
            display: none;
        }

        .modal {
            background: #fff;
            border-radius: 8px;
            padding: 18px 20px;
            width: 300px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .18);
        }

        .modal h3 {
            font-size: .95rem;
            margin-bottom: 4px;
        }

        .modal-tip {
            font-size: .78rem;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .modal input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 6px 9px;
            font-size: .88rem;
            margin-bottom: 12px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .layout {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        aside {
            width: 270px;
            border-right: 1px solid var(--border);
            background: var(--card);
            display: flex;
            flex-direction: column;
        }

        .side-tools {
            padding: .6rem;
            display: flex;
            gap: .4rem;
            border-bottom: 1px solid var(--border);
        }

        .side-tools select {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: .85rem;
            background: #fff;
        }

        .conv-list {
            flex: 1;
            overflow-y: auto;
        }

        .conv-item {
            padding: .5rem .7rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .conv-item:hover {
            background: var(--bg);
        }

        .conv-item.active {
            background: #eef2ff;
            border-left: 3px solid var(--primary);
        }

        .conv-item .meta {
            font-size: .75rem;
            color: var(--text2);
            display: flex;
            gap: .45rem;
            align-items: center;
        }

        .conv-item .preview {
            font-size: .8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
            margin-top: .15rem;
        }

        .badge {
            background: var(--warn);
            color: #fff;
            border-radius: 8px;
            font-size: .7rem;
            padding: 0 .35rem;
        }

        .badge.gray {
            background: var(--text2);
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.5rem 3rem;
        }

        .empty {
            color: var(--text2);
            text-align: center;
            margin-top: 4rem;
            line-height: 2;
        }

        .conv-header {
            display: flex;
            align-items: center;
            gap: .8rem;
            margin-bottom: .9rem;
            flex-wrap: wrap;
            position: sticky;
            top: -1rem;
            background: var(--bg);
            padding: .5rem 0;
            z-index: 10;
        }

        .conv-header .title {
            font-weight: 600;
            flex: 1;
        }

        .conv-header button {
            padding: .3rem .7rem;
            font-size: .8rem;
        }

        .search-group {
            display: flex;
            align-items: center;
            gap: .35rem;
        }

        .search-group input {
            padding: .3rem .55rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: .85rem;
            width: 220px;
        }

        .search-group button {
            padding: .3rem .55rem;
        }

        .search-group .count {
            font-size: .78rem;
            color: var(--text2);
            min-width: 3.5em;
            text-align: center;
        }

        .replace-group {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
        }

        .replace-group input {
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 3px 7px;
            font-size: .8rem;
            width: 160px;
        }

        .replace-group button {
            padding: 3px 8px;
            font-size: .78rem;
        }

        .replace-group .btn-replace {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .replace-group .btn-undo {
            background: #fff;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 5px;
            cursor: pointer;
        }

        .replace-group .btn-undo:disabled {
            color: #d1d5db;
            border-color: #e5e7eb;
            cursor: not-allowed;
        }

        .modal-preview {
            max-height: 50vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: .82rem;
            line-height: 1.55;
        }

        .modal-preview .diff-item {
            padding: 6px 0;
            border-bottom: 1px dashed var(--border);
        }

        .modal-preview .diff-item:last-child {
            border-bottom: none;
        }

        .modal-preview .diff-key {
            color: var(--muted);
            font-size: .72rem;
            margin-bottom: 2px;
        }

        .modal-preview .old {
            color: #b91c1c;
            text-decoration: line-through;
        }

        .modal-preview .sep {
            color: var(--muted);
            margin: 0 6px;
        }

        .modal-preview .new {
            color: #047857;
            background: #d1fae5;
            padding: 0 2px;
            border-radius: 2px;
        }

        .sys-card,
        .turn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: .9rem;
            overflow: hidden;
        }

        .sys-head,
        .turn-head {
            padding: .4rem .8rem;
            font-size: .8rem;
            color: var(--text2);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: .5rem;
            align-items: center;
        }

        .sys-body {
            padding: .6rem .8rem;
            white-space: pre-wrap;
            font-size: .85rem;
            color: var(--text2);
            max-height: 5.6em;
            overflow: hidden;
        }

        .sys-body.expanded {
            max-height: none;
        }

        .lock {
            font-size: .75rem;
        }

        .msg {
            border-top: 1px solid var(--border);
        }

        .msg:first-child {
            border-top: none;
        }

        .msg-head {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .4rem .8rem 0;
            font-size: .78rem;
            color: var(--text2);
        }

        .msg-head .spacer {
            flex: 1;
        }

        .role {
            font-weight: 600;
            padding: .05rem .45rem;
            border-radius: 6px;
            color: #fff;
            font-size: .72rem;
        }

        .role.user {
            background: var(--user);
        }

        .role.assistant {
            background: var(--asst);
        }

        .role.other {
            background: var(--text2);
        }

        .ta-wrap {
            position: relative;
        }

        .ta-wrap .backdrop {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            padding: .35rem .8rem .7rem;
            font: inherit;
            font-size: .9rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            color: transparent;
        }

        .ta-wrap mark {
            background: #fde68a;
            border-radius: 2px;
        }

        .msg textarea {
            position: relative;
            display: block;
            width: 100%;
            border: none;
            resize: none;
            outline: none;
            padding: .35rem .8rem .7rem;
            font: inherit;
            font-size: .9rem;
            line-height: 1.55;
            background: transparent;
            overflow: hidden;
        }

        .ta-wrap mark.d {
            background: #bbf7d0;
        }

        .sys-body mark {
            background: #fde68a;
            border-radius: 2px;
        }

        .cur-match .hl mark {
            background: #fdba74;
        }

        mark,
        [data-key] {
            scroll-margin-top: 4rem;
        }

        .msg .mod-badge {
            display: none;
        }

        .msg.modified .mod-badge {
            display: inline;
        }

        .msg .only-mod {
            visibility: hidden;
        }

        .msg.modified .only-mod {
            visibility: visible;
        }

        .orig {
            display: none;
            margin: 0 .8rem .7rem;
            padding: .5rem .7rem;
            background: var(--bg);
            border: 1px dashed var(--border);
            border-radius: 6px;
            font-size: .8rem;
            color: var(--text2);
            white-space: pre-wrap;
        }

        .orig.show {
            display: block;
        }
    </style>
</head>

<body>
    <header>
        <h1>话术微调标注</h1>
        <span id="progressText">未加载数据</span>
        <button id="btnAnnotator" class="secondary" title="点击修改标注人">标注人：未设置</button>
        <button id="btnOpen">打开数据文件</button>
        <button id="btnImportPatch" disabled>导入补丁合并</button>
        <button id="btnExportData" disabled>导出数据</button>
        <button id="btnMergeRaw" class="secondary">⊞ 合并 Raw Patches</button>
    </header>
    <div class="layout">
        <aside>
            <div class="side-tools">
                <select id="filter" disabled>
                    <option value="all">全部</option>
                    <option value="modified">已修改</option>
                    <option value="unmodified">未修改</option>
                </select>
            </div>
            <div id="convList" class="conv-list"></div>
        </aside>
        <main id="main">
            <div class="empty">请点击右上角「打开数据文件」加载原始对话 JSON<br>或通过 URL 参数 ?data=文件名.json 自动加载</div>
        </main>
    </div>
    <!-- 隐藏的文件输入 -->
    <input type="file" id="fileInput" accept=".json" hidden>
    <input type="file" id="patchInput" accept=".json" multiple hidden>

    <!-- 标注人署名弹窗 -->
    <div id="annotatorModal" class="modal-mask" hidden>
        <div class="modal">
            <h3>填写标注人</h3>
            <p class="modal-tip">姓名/工号将写入文件名，便于追溯；只需填写一次</p>
            <input id="annotatorInput" type="text" placeholder="如：张三" maxlength="20">
            <div class="modal-actions">
                <button id="annotatorCancel" class="secondary">取消</button>
                <button id="annotatorOk">确定</button>
            </div>
        </div>
    </div>

    <!-- 批量替换预览确认弹窗 -->
    <div id="replaceModal" class="modal-mask" hidden>
        <div class="modal" style="width: 460px;">
            <h3>批量替换预览</h3>
            <p class="modal-tip" id="replaceSummary"></p>
            <div id="replacePreview" class="modal-preview"></div>
            <div class="modal-actions">
                <button id="replaceCancel" class="secondary">取消</button>
                <button id="replaceOk">确认替换</button>
            </div>
        </div>
    </div>

    <!-- Raw Patches 合并面板 -->
    <div id="mergeModal" class="modal-mask" hidden>
        <div class="modal" style="width: 620px;">
            <h3>⊞ 合并 Raw Patches</h3>
            <p class="modal-tip">选择多个 patch_raw_*.json 文件，合并为一个完整数组并可选去重。此操作独立于当前标注状态。</p>

            <div id="mergeWarnings" style="display:none"></div>

            <div style="margin:12px 0; display:flex; gap:8px; align-items:center;">
                <button id="mergeAddFiles">选择文件</button>
                <button id="mergeClearAll" class="secondary">清空列表</button>
                <input type="file" id="mergeFileInput" accept=".json" multiple hidden>
                <label style="font-size:.78rem; color:var(--muted); margin-left:auto;">
                    <input type="checkbox" id="mergeDedup" checked> 合并时自动去重
                </label>
            </div>

            <div id="mergeFileList" style="max-height:220px; overflow-y:auto; border:1px solid var(--border); border-radius:6px; padding:6px; margin-bottom:12px;">
                <div style="color:var(--muted); font-size:.8rem; padding:20px; text-align:center;">尚未选择任何文件</div>
            </div>

            <div id="mergeProgress" style="font-size:.8rem; color:var(--text2); margin-bottom:10px; min-height:1.2em;"></div>

            <div class="modal-actions">
                <button id="mergeCancel" class="secondary">关闭</button>
                <button id="mergeDo" disabled>开始合并</button>
            </div>
        </div>
    </div>

    <!-- 合并结果展示弹窗 -->
    <div id="mergeResultModal" class="modal-mask" hidden>
        <div class="modal" style="width: 540px;">
            <h3 id="mergeResultTitle">合并完成</h3>
            <div id="mergeResultBody" style="font-size:.82rem; line-height:1.75; margin-bottom:12px;"></div>
            <div class="modal-actions">
                <button id="mergeResultClose" class="secondary">关闭</button>
                <button id="mergeResultExport" disabled>保存为文件</button>
            </div>
        </div>
    </div>

    <!-- 导出选择弹窗 -->
    <div id="exportModal" class="modal-mask" hidden>
        <div class="modal" style="width: 360px;">
            <h3>选择导出内容</h3>
            <p class="modal-tip">请勾选您需要提交的文件格式，系统将自动下载。</p>
            <div style="margin: 15px 0; display: flex; flex-direction: column; gap: 12px;">
                <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                    <input type="checkbox" id="chkExportFull" checked
                        style="width: 16px; height: 16px; margin-top: 2px;">
                    <div>
                        <b>完整文件</b>
                        <div style="font-size: 0.75rem; color: var(--text2);">包含全部修改的完整数据</div>
                    </div>
                </label>
                <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 0.9rem;">
                    <input type="checkbox" id="chkExportPatch" checked
                        style="width: 16px; height: 16px; margin-top: 2px;">
                    <div>
                        <b>修改补丁</b>
                        <div style="font-size: 0.75rem; color: var(--text2);">仅包含修改的片段，分为带记录版和纯净版</div>
                    </div>
                </label>
            </div>
            <div class="modal-actions">
                <button id="exportCancel" class="secondary">取消</button>
                <button id="exportOk">确认导出</button>
            </div>
        </div>
    </div>

    <script>
        const state = {
            data: null, fileName: '', totalMsgs: 0, dataSig: '',
            edits: new Map(),
            current: -1,
            searchText: null,
            lastBatch: null,
            hasExported: false,
        };

        const search = { q: '', matches: [], cur: -1 };

        const $ = id => document.getElementById(id);
        const keyOf = (ci, mi) => ci + ':' + mi;

        function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

        /* ---------- 数据加载与校验 ---------- */
        function validateData(data) {
            const errors = [];
            if (!Array.isArray(data)) return ['顶层结构不是 JSON 数组'];
            data.forEach((conv, i) => {
                const msgs = conv && conv.messages;
                if (!Array.isArray(msgs) || msgs.length === 0) { errors.push(`会话 ${i}: messages 缺失或为空`); return; }
                const roles = [];
                msgs.forEach((m, j) => {
                    if (!m || typeof m.role !== 'string' || typeof m.content !== 'string') {
                        errors.push(`会话 ${i} 消息 ${j}: 缺少 role 或 content 字段`); return;
                    }
                    roles.push(m.role);
                });
                if (!roles.length) return;
                if (roles[0] !== 'system') errors.push(`会话 ${i}: 首条消息不是 system`);
                else if (roles.filter(r => r === 'system').length > 1) errors.push(`会话 ${i}: 存在多条 system 消息`);
                for (let j = 1; j < roles.length; j++) {
                    const expect = j % 2 === 1 ? 'user' : 'assistant';
                    if (roles[j] !== 'user' && roles[j] !== 'assistant') errors.push(`会话 ${i} 消息 ${j}: 非法角色 ${roles[j]}`);
                    else if (roles[j] !== expect) errors.push(`会话 ${i} 消息 ${j}: 应为 ${expect}，实际为 ${roles[j]}`);
                }
                if ((roles.length - 1) % 2 !== 0) errors.push(`会话 ${i}: 非 system 消息数为奇数，存在未配对轮次`);
            });
            return errors;
        }

        function loadData(data, fileName) {
            const errors = validateData(data);
            if (errors.length) {
                alert('数据结构校验未通过，共 ' + errors.length + ' 处问题：\n' + errors.slice(0, 10).join('\n') + (errors.length > 10 ? '\n...' : ''));
                return;
            }
            state.data = data;
            state.fileName = fileName;
            state.totalMsgs = data.reduce((s, c) => s + c.messages.length, 0);

            const sysLen = data.length && data[0].messages.length ? data[0].messages[0].content.length : 0;
            const lastMsgs = data.length ? data[data.length - 1].messages : [];
            const lastLen = lastMsgs.length ? lastMsgs[lastMsgs.length - 1].content.length : 0;
            state.dataSig = `${data.length}:${state.totalMsgs}:${sysLen}:${lastLen}`;

            state.edits = new Map();
            state.current = -1;
            state.searchText = null;
            search.q = ''; search.matches = []; search.cur = -1;
            state.hasExported = false;

            restoreEdits();

            $('filter').disabled = false;
            $('btnImportPatch').disabled = false;
            $('btnExportData').disabled = false;

            renderSidebar();
            selectConv(0);
            updateProgress();
        }

        /* ---------- 本地暂存 ---------- */
        function storageKey() { return `pair_annotator:${state.fileName}:${state.data.length}:${state.totalMsgs}`; }
        let saveTimer = null;
        function scheduleSave() {
            clearTimeout(saveTimer);
            if (state.hasExported) return;
            saveTimer = setTimeout(() => {
                if (state.edits.size > 0) {
                    localStorage.setItem(storageKey(), JSON.stringify([...state.edits]));
                } else {
                    localStorage.removeItem(storageKey());
                }
            }, 300);
        }
        function restoreEdits() {
            try {
                const raw = localStorage.getItem(storageKey());
                if (raw) state.edits = new Map(JSON.parse(raw));
            } catch (e) { /* 忽略损坏的暂存 */ }
        }

        function resetAfterExport() {
            clearTimeout(saveTimer);
            state.hasExported = true;
            state.edits.clear();
            state.lastBatch = null;
            localStorage.removeItem(storageKey());

            const ri = $('replaceInput');
            if (ri) ri.value = '';

            renderSidebar();
            if (state.current >= 0) selectConv(state.current);
            updateProgress();
        }

        /* ---------- 侧栏 ---------- */
        function convEditCount(ci) {
            let n = 0;
            for (const k of state.edits.keys()) if (Number(k.split(':')[0]) === ci) n++;
            return n;
        }
        function buildSearchText() {
            state.searchText = state.data.map((c, ci) =>
                c.messages.map((m, mi) => currentContentOf(ci, mi)).join('\n').toLowerCase()
            );
        }
        function renderSidebar() {
            const list = $('convList');
            const q = search.q.trim().toLowerCase();
            const filter = $('filter').value;
            if (q && !state.searchText) buildSearchText();
            const html = [];
            state.data.forEach((conv, i) => {
                const mod = convEditCount(i);
                if (filter === 'modified' && !mod) return;
                if (filter === 'unmodified' && mod) return;
                if (q && !String(i).includes(q) && !state.searchText[i].includes(q)) return;
                const firstUser = conv.messages.find(m => m.role === 'user');
                const preview = firstUser ? firstUser.content : '(无 user 消息)';
                html.push(
                    `<div class="conv-item${i === state.current ? ' active' : ''}" data-ci="${i}">` +
                    `<div class="meta"><span>#${i}</span><span>${(conv.messages.length - 1) / 2} 轮</span>` +
                    (mod ? `<span class="badge">改 ${mod}</span>` : '') +
                    `</div><div class="preview">${escapeHTML(preview)}</div></div>`
                );
            });
            list.innerHTML = html.join('');
        }
        function refreshSidebarItem(ci) {
            const item = $('convList').querySelector(`[data-ci="${ci}"]`);
            if (!item) return;
            const meta = item.querySelector('.meta');
            const old = meta.querySelector('.badge');
            if (old) old.remove();
            const mod = convEditCount(ci);
            if (mod) { const b = el('span', 'badge'); b.textContent = '改 ' + mod; meta.append(b); }
        }

        /* ---------- 主区域 ---------- */
        function selectConv(i) {
            if (!state.data || i < 0 || i >= state.data.length) return;
            state.current = i;
            document.querySelectorAll('.conv-item.active').forEach(e => e.classList.remove('active'));
            const item = $('convList').querySelector(`[data-ci="${i}"]`);
            if (item) { item.classList.add('active'); item.scrollIntoView({ block: 'nearest' }); }
            renderMain();
        }

        function groupTurns(msgs) {
            const turns = []; let cur = null;
            for (let i = 1; i < msgs.length; i++) {
                if (msgs[i].role === 'user' || !cur) { cur = []; turns.push(cur); }
                cur.push(i);
            }
            return turns;
        }

        function renderMain() {
            const main = $('main');
            main.textContent = '';
            const ci = state.current;
            const conv = state.data[ci];
            const msgs = conv.messages;

            const head = el('div', 'conv-header');
            const sg = el('div', 'search-group');
            const si = el('input'); si.id = 'mainSearch'; si.placeholder = '搜索关键词/短句（高亮+筛选会话，Enter 下一个）';
            si.value = search.q;
            let searchTimer = null;
            si.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => doSearch(true), 250); });
            si.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); doSearch(e.shiftKey ? 'prev' : 'next'); }
            });
            const btnUp = el('button'); btnUp.textContent = '↑'; btnUp.title = '上一个匹配';
            btnUp.addEventListener('click', () => jumpToMatch(search.cur - 1));
            const btnDown = el('button'); btnDown.textContent = '↓'; btnDown.title = '下一个匹配';
            btnDown.addEventListener('click', () => jumpToMatch(search.cur + 1));
            const cnt = el('span', 'count'); cnt.id = 'matchCount';
            sg.append(si, btnUp, btnDown, cnt);

            const rg = el('div', 'replace-group');
            const ri = el('input'); ri.id = 'replaceInput'; ri.placeholder = '替换为';
            ri.addEventListener('keydown', e => { if (e.key === 'Enter') doBatchReplace(); });
            const bRep = el('button', 'btn-replace'); bRep.textContent = '批量替换';
            bRep.addEventListener('click', doBatchReplace);
            const bUndo = el('button', 'btn-undo'); bUndo.textContent = '↶ 撤销上一批';
            bUndo.disabled = !state.lastBatch;
            bUndo.addEventListener('click', undoLastBatch);
            rg.append(ri, bRep, bUndo);
            sg.append(rg);

            const btnPrev = el('button'); btnPrev.textContent = '← 上一条'; btnPrev.disabled = ci === 0;
            btnPrev.addEventListener('click', () => selectConv(ci - 1));
            const btnNext = el('button'); btnNext.textContent = '下一条 →'; btnNext.disabled = ci === state.data.length - 1;
            btnNext.addEventListener('click', () => selectConv(ci + 1));
            const title = el('span', 'title');
            title.textContent = `会话 #${ci}（共 ${(msgs.length - 1) / 2} 轮）`;
            head.append(sg, title, btnPrev, btnNext);
            main.append(head);

            const sysCard = el('div', 'sys-card');
            sysCard.dataset.key = ci + ':0';
            const sysHead = el('div', 'sys-head');
            const lock = el('span', 'lock'); lock.textContent = '🔒 system（只读）';
            const toggle = el('button', 'link'); toggle.textContent = '展开';
            sysHead.append(lock, toggle);
            const sysBody = el('div', 'sys-body');
            sysBody.textContent = msgs[0].content;
            toggle.addEventListener('click', () => {
                sysBody.classList.toggle('expanded');
                toggle.textContent = sysBody.classList.contains('expanded') ? '收起' : '展开';
            });
            sysCard.append(sysHead, sysBody);
            main.append(sysCard);

            groupTurns(msgs).forEach((turn, t) => {
                const card = el('div', 'turn');
                const th = el('div', 'turn-head'); th.textContent = '第 ' + (t + 1) + ' 轮';
                card.append(th);
                turn.forEach(mi => card.append(msgBlock(ci, mi)));
                main.append(card);
            });
            main.querySelectorAll('textarea').forEach(autoResize);
            refreshHighlights();
            updateMatchUI();
        }

        function msgBlock(ci, mi) {
            const m = state.data[ci].messages[mi];
            const k = keyOf(ci, mi);
            const edited = state.edits.get(k);
            const isMod = edited !== undefined && edited !== m.content;

            const wrap = el('div', 'msg' + (isMod ? ' modified' : ''));
            wrap.dataset.key = k;
            const head = el('div', 'msg-head');
            const role = el('span', 'role ' + (m.role === 'user' ? 'user' : m.role === 'assistant' ? 'assistant' : 'other'));
            role.textContent = m.role;
            const idx = el('span'); idx.textContent = '#' + mi;
            head.append(role, idx);
            if ('loss' in m) { const lb = el('span', 'badge gray'); lb.textContent = 'loss: ' + m.loss; head.append(lb); }
            const modBadge = el('span', 'badge mod-badge'); modBadge.textContent = '已修改';
            head.append(modBadge);
            const spacer = el('span', 'spacer'); head.append(spacer);
            const btnOrig = el('button', 'link only-mod'); btnOrig.textContent = '原文';
            const btnRevert = el('button', 'link only-mod'); btnRevert.textContent = '还原';
            head.append(btnOrig, btnRevert);

            const ta = el('textarea');
            ta.value = isMod ? edited : m.content;
            ta.rows = 1;
            ta.addEventListener('input', () => { autoResize(ta); onEdit(ci, mi, ta, wrap); });

            const taWrap = el('div', 'ta-wrap');
            const bd = el('div', 'backdrop');
            const hl = el('div', 'hl');
            bd.append(hl);
            taWrap.append(bd, ta);

            const orig = el('div', 'orig');
            orig.textContent = m.content;
            btnOrig.addEventListener('click', () => orig.classList.toggle('show'));
            btnRevert.addEventListener('click', () => { ta.value = m.content; autoResize(ta); onEdit(ci, mi, ta, wrap); });

            wrap.append(head, taWrap, orig);
            return wrap;
        }

        function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

        function onEdit(ci, mi, ta, wrap) {
            const orig = state.data[ci].messages[mi].content;
            const k = keyOf(ci, mi);
            const isMod = ta.value !== orig;
            if (isMod) state.edits.set(k, ta.value); else state.edits.delete(k);

            state.hasExported = false;

            wrap.classList.toggle('modified', isMod);
            const hl = wrap.querySelector('.backdrop .hl');
            if (hl) hl.innerHTML = renderBackdropHTML(ta.value, orig, search.q);
            refreshSidebarItem(ci);
            updateProgress();
            scheduleSave();
        }

        function updateProgress() {
            if (!state.data) return;
            const convs = new Set([...state.edits.keys()].map(k => Number(k.split(':')[0]))).size;
            $('progressText').textContent =
                `${state.fileName} · 已修改会话 ${convs}/${state.data.length} · 已修改消息 ${state.edits.size}`;
        }

        /* ---------- 话术搜索与高亮 ---------- */
        function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        function escapeHTML(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function highlightHTML(text, q) {
            if (!q) return escapeHTML(text) + ' ';
            const re = new RegExp(escapeRegExp(q), 'gi');
            let out = '', last = 0, m;
            while ((m = re.exec(text))) {
                out += escapeHTML(text.slice(last, m.index)) + '<mark>' + escapeHTML(m[0]) + '</mark>';
                last = m.index + m[0].length;
                if (m[0].length === 0) re.lastIndex++;
            }
            return out + escapeHTML(text.slice(last)) + ' ';
        }
        function diffSpan(orig, cur) {
            let s = 0;
            const minLen = Math.min(orig.length, cur.length);
            while (s < minLen && orig[s] === cur[s]) s++;
            let e = cur.length, o = orig.length;
            while (e > s && o > s && orig[o - 1] === cur[e - 1]) { e--; o--; }
            return [s, e];
        }
        function renderBackdropHTML(text, orig, q) {
            const cover = new Array(text.length).fill(null);
            if (orig !== undefined && orig !== text) {
                const [s, e] = diffSpan(orig, text);
                for (let i = s; i < e; i++) cover[i] = 'd';
            }
            if (q) {
                const re = new RegExp(escapeRegExp(q), 'gi');
                let m;
                while ((m = re.exec(text))) {
                    for (let i = m.index; i < m.index + m[0].length; i++) cover[i] = 's';
                    if (m[0].length === 0) re.lastIndex++;
                }
            }
            let out = '', i = 0;
            while (i < text.length) {
                const t = cover[i];
                let j = i;
                while (j < text.length && cover[j] === t) j++;
                const seg = escapeHTML(text.slice(i, j));
                out += t === 's' ? '<mark>' + seg + '</mark>' : t === 'd' ? '<mark class="d">' + seg + '</mark>' : seg;
                i = j;
            }
            return out + ' ';
        }
        function refreshHighlights() {
            if (!state.data || state.current < 0) return;
            const q = search.q;
            const sysBody = $('main').querySelector('.sys-body');
            if (sysBody) {
                const content = state.data[state.current].messages[0].content;
                if (q) sysBody.innerHTML = highlightHTML(content, q);
                else sysBody.textContent = content;
            }
            $('main').querySelectorAll('.msg').forEach(wrap => {
                const ta = wrap.querySelector('textarea');
                const hl = wrap.querySelector('.backdrop .hl');
                if (ta && hl) {
                    const [ci, mi] = wrap.dataset.key.split(':').map(Number);
                    hl.innerHTML = renderBackdropHTML(ta.value, state.data[ci].messages[mi].content, q);
                }
            });
        }
        function updateMatchUI() {
            const cnt = $('matchCount');
            if (!cnt) return;
            cnt.textContent = search.q ? (search.matches.length ? `${search.cur + 1}/${search.matches.length}` : '无匹配') : '';
        }
        function clearCurMatch() {
            document.querySelectorAll('.cur-match').forEach(e => e.classList.remove('cur-match'));
        }
        function computeMatches(q) {
            const res = [];
            if (!q || !state.data) return res;
            const lq = q.toLowerCase();
            state.data.forEach((conv, ci) => {
                conv.messages.forEach((m, mi) => {
                    if (currentContentOf(ci, mi).toLowerCase().includes(lq)) res.push({ ci, mi });
                });
            });
            return res;
        }

        /* ---------- 批量替换 ---------- */
        function currentContentOf(ci, mi) {
            const k = keyOf(ci, mi);
            if (state.edits.has(k)) return state.edits.get(k);
            return state.data[ci].messages[mi].content;
        }
        function scanBatchReplace(q, replacement) {
            const result = [];
            if (!q || !state.data) return result;
            state.data.forEach((conv, ci) => {
                conv.messages.forEach((m, mi) => {
                    if (m.role === 'system') return;
                    const old = currentContentOf(ci, mi);
                    if (old.indexOf(q) === -1) return;
                    const rep = old.split(q).join(replacement);
                    if (rep !== old) result.push({ ci, mi, old, new: rep });
                });
            });
            return result;
        }
        let batchPending = null;
        function flashMsg(text) {
            const t = $('progressText'); const old = t.textContent;
            t.textContent = text; setTimeout(() => { t.textContent = old; }, 2200);
        }
        function doBatchReplace() {
            const q = search.q;
            const replacement = $('replaceInput') ? $('replaceInput').value : '';
            if (!q) { flashMsg('请先在搜索框输入要查找的关键词/短句'); return; }
            if (replacement === '') { flashMsg('请在「替换为」框里填新内容'); return; }
            const hits = scanBatchReplace(q, replacement);
            if (!hits.length) { flashMsg('当前关键词在所有 user/assistant 消息中没有匹配'); return; }

            const convIds = new Set(hits.map(h => h.ci));
            const summary = `关键词「${q}」 → 替换为「${replacement}」\n影响 ${convIds.size} 条会话，共 ${hits.length} 处将被替换`;
            $('replaceSummary').textContent = summary;
            const pv = $('replacePreview');
            const show = hits.slice(0, 3);
            pv.innerHTML = show.map(h => {
                const oldShort = h.old.length > 60 ? h.old.slice(0, 57) + '…' : h.old;
                const newShort = h.new.length > 60 ? h.new.slice(0, 57) + '…' : h.new;
                return `<div class="diff-item"><div class="diff-key">会话 #${h.ci} · 消息 ${h.mi}</div>` +
                    `<div><span class="old"></span>${escapeHTML(oldShort)}</div>` +
                    `<div><span class="sep">→</span><span class="new">${escapeHTML(newShort)}</span></div></div>`;
            }).join('');
            if (hits.length > 3) pv.innerHTML += `<p class="modal-tip" style="margin-top:8px">（仅展示前 3 条，还有 ${hits.length - 3} 处未列出）</p>`;
            batchPending = { q, replacement, hits };
            $('replaceModal').hidden = false;
        }
        $('replaceOk') && $('replaceOk').addEventListener('click', () => {
            if (!batchPending) return;
            const { hits } = batchPending;
            const undoEntries = [];
            hits.forEach(({ ci, mi, old, new: rep }) => {
                const k = keyOf(ci, mi);
                const had = state.edits.has(k);
                if (rep === state.data[ci].messages[mi].content) {
                    state.edits.delete(k);
                } else {
                    state.edits.set(k, rep);
                }
                undoEntries.push([k, old, had]);
            });
            state.lastBatch = undoEntries;
            batchPending = null;
            $('replaceModal').hidden = true;
            refreshAfterBatch();
        });
        $('replaceCancel') && $('replaceCancel').addEventListener('click', () => {
            batchPending = null;
            $('replaceModal').hidden = true;
        });
        function undoLastBatch() {
            if (!state.lastBatch) return;
            state.lastBatch.forEach(([k, old, had]) => {
                const [ci, mi] = k.split(':').map(Number);
                const orig = state.data[ci].messages[mi].content;
                if (old === orig) {
                    state.edits.delete(k);
                } else {
                    state.edits.set(k, old);
                }
            });
            state.lastBatch = null;
            refreshAfterBatch();
        }
        function refreshAfterBatch() {
            if (state.current < 0) state.current = 0;
            state.hasExported = false;

            renderMain();
            buildSearchText();
            search.matches = computeMatches(search.q);
            search.cur = search.matches.length ? 0 : -1;
            refreshHighlights();
            updateMatchUI();
            updateProgress();
            const affected = new Set([...state.edits.keys()].map(k => Number(k.split(':')[0])));
            affected.forEach(ci => refreshSidebarItem(ci));
            const b = document.querySelector('.btn-undo');
            if (b) b.disabled = !state.lastBatch;
            scheduleSave();
        }
        function doSearch(mode) {
            const si = $('mainSearch');
            const q = si ? si.value : '';
            if (mode === true || q !== search.q) {
                search.q = q;
                search.matches = computeMatches(q);
                search.cur = -1;
                refreshHighlights();
                updateMatchUI();
                renderSidebar();
                if (search.matches.length) jumpToMatch(0);
                else clearCurMatch();
                return;
            }
            if (mode === 'next') jumpToMatch(search.cur + 1);
            else if (mode === 'prev') jumpToMatch(search.cur - 1);
        }
        function jumpToMatch(i) {
            if (!search.matches.length) return;
            search.cur = ((i % search.matches.length) + search.matches.length) % search.matches.length;
            const { ci, mi } = search.matches[search.cur];
            const sameConv = ci === state.current;
            if (!sameConv) selectConv(ci);
            clearCurMatch();
            const target = $('main').querySelector(`[data-key="${ci}:${mi}"]`);
            if (!target) { updateMatchUI(); return; }
            target.classList.add('cur-match');
            if (mi === 0) {
                const sysBody = target.querySelector('.sys-body');
                const toggle = target.querySelector('.sys-head .link');
                if (sysBody && !sysBody.classList.contains('expanded')) {
                    sysBody.classList.add('expanded');
                    if (toggle) toggle.textContent = '收起';
                }
            }
            const mark = target.querySelector('.hl mark') || target.querySelector('.sys-body mark') || target;
            mark.scrollIntoView({ block: 'center', behavior: 'auto' });
            updateMatchUI();
            const si = $('mainSearch');
            if (si && document.activeElement !== si) {
                si.focus();
                si.setSelectionRange(si.value.length, si.value.length);
            }
        }

        /* ---------- 标注人署名 ---------- */
        let annotatorCallback = null;
        function getAnnotator() { return localStorage.getItem('pair_annotator_annotator') || ''; }
        function sanitizeName(s) { return s.trim().replace(/[\\/:*?"<>|\s]+/g, '_'); }
        function updateAnnotatorUI() {
            $('btnAnnotator').textContent = '标注人：' + (getAnnotator() || '未设置');
        }
        function openAnnotatorModal(cb) {
            annotatorCallback = cb || null;
            $('annotatorInput').value = getAnnotator();
            $('annotatorModal').hidden = false;
            $('annotatorInput').focus();
        }
        function closeAnnotatorModal() { $('annotatorModal').hidden = true; annotatorCallback = null; }
        $('annotatorOk').addEventListener('click', () => {
            const n = sanitizeName($('annotatorInput').value);
            if (!n) { $('annotatorInput').focus(); return; }
            localStorage.setItem('pair_annotator_annotator', n);
            updateAnnotatorUI();
            const cb = annotatorCallback;
            closeAnnotatorModal();
            if (cb) cb();
        });
        $('annotatorCancel').addEventListener('click', closeAnnotatorModal);
        $('annotatorInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') $('annotatorOk').click();
            if (e.key === 'Escape') closeAnnotatorModal();
        });

        /* ---------- 导入补丁合并 ---------- */
        $('btnImportPatch').addEventListener('click', () => $('patchInput').click());

        $('patchInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            e.target.value = ''; // 清空 input，允许重复选同一个文件

            if (state.data === null) {
                alert('请先打开原始数据文件，再导入补丁！');
                return;
            }

            let appliedCount = 0;
            let skippedCount = 0;
            let errorFiles = [];

            // 使用 for...of 保证按顺序应用
            for (const file of files) {
                try {
                    const text = await file.text();
                    const patch = JSON.parse(text);
                    let appliedInFile = 0;
                    let conflict = false;

                    // 格式 1: 旧版补丁 { edits: [{ conv_idx, msg_idx, content }] }
                    if (patch.edits && Array.isArray(patch.edits)) {
                        patch.edits.forEach(edit => {
                            const { conv_idx, msg_idx, content } = edit;
                            if (conv_idx >= 0 && conv_idx < state.data.length && msg_idx >= 0 && msg_idx < state.data[conv_idx].messages.length) {
                                const k = keyOf(conv_idx, msg_idx);
                                const orig = state.data[conv_idx].messages[msg_idx].content;
                                if (content !== orig) {
                                    state.edits.set(k, content);
                                    appliedInFile++;
                                }
                            }
                        });
                    }
                    // 格式 2: 新版导出（带记录版） { data_sig, conversations: [...] }
                    else if (patch.conversations && Array.isArray(patch.conversations)) {
                        if (patch.data_sig && patch.data_sig !== state.dataSig) {
                            errorFiles.push(`${file.name} (数据指纹不匹配，可能不是同一个原文件)`);
                            continue;
                        }
                        // 遍历所有会话，比对找出差异
                        patch.conversations.forEach((conv, ci) => {
                            if (ci >= state.data.length) return;
                            const origMessages = state.data[ci].messages;
                            const newMessages = conv.messages;
                            if (!newMessages) return;

                            for (let mi = 0; mi < newMessages.length; mi++) {
                                if (mi >= origMessages.length) break;
                                if (newMessages[mi].content !== origMessages[mi].content) {
                                    const k = keyOf(ci, mi);
                                    // 如果当前已经存在修改且内容不同，说明有冲突
                                    if (state.edits.has(k) && state.edits.get(k) !== newMessages[mi].content) {
                                        conflict = true;
                                    }
                                    state.edits.set(k, newMessages[mi].content);
                                    appliedInFile++;
                                }
                            }
                        });
                    }
                    // 格式 3: 纯数组 (patch_raw)
                    else if (Array.isArray(patch)) {
                        errorFiles.push(`${file.name} (不支持直接合并纯净版patch_raw，请使用带记录版的补丁)`);
                        continue;
                    } else {
                        errorFiles.push(`${file.name} (未知的补丁格式)`);
                        continue;
                    }

                    appliedCount += appliedInFile;
                    if (conflict) {
                        alert(`提示：文件 ${file.name} 中部分修改与之前的修改存在冲突，系统已自动保留最新导入的内容。`);
                    }

                } catch (err) {
                    errorFiles.push(`${file.name} (解析失败: ${err.message})`);
                }
            }

            // 应用完毕，刷新界面
            if (appliedCount > 0) {
                state.hasExported = false;
                scheduleSave();
                renderSidebar();
                renderMain();
                updateProgress();

                let msg = `补丁导入完成！\n\n成功应用了 ${appliedCount} 处修改。\n这些修改已经在页面上以绿色高亮显示，请核对。`;
                if (errorFiles.length) {
                    msg += `\n\n以下文件未能成功合并：\n` + errorFiles.map(e => `- ${e}`).join('\n');
                }
                alert(msg);
            } else {
                let msg = `未能应用任何修改。`;
                if (errorFiles.length) {
                    msg += `\n\n原因如下：\n` + errorFiles.map(e => `- ${e}`).join('\n');
                }
                alert(msg);
            }
        });

        /* ---------- Raw Patches 合并模块（独立于 state，不影响标注） ---------- */
        const mergeState = {
            files: [],          // [{ file, name, size, valid, reason, convCount }]
            merged: null,       // 合并后的数组
            dedup: true,
        };
        function fmtSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
            return (bytes / 1073741824).toFixed(2) + ' GB';
        }
        function sortObjectKeys(obj) {
            // 递归对齐 Python 版 json.dumps(conv, sort_keys=True)
            if (obj === null || typeof obj !== 'object') return obj;
            if (Array.isArray(obj)) return obj.map(sortObjectKeys);
            const out = {};
            Object.keys(obj).sort().forEach(k => { out[k] = sortObjectKeys(obj[k]); });
            return out;
        }
        function convHash(conv) {
            try { return JSON.stringify(sortObjectKeys(conv)); }
            catch (e) { return null; }
        }
        function validateMergeFile(file) {
            // 返回 { valid, reason, convCount }
            return new Promise(async resolve => {
                try {
                    const text = await file.text();  // 浏览器会自动剥 BOM
                    let data;
                    try { data = JSON.parse(text); }
                    catch (e) { resolve({ valid: false, reason: 'JSON 解析失败：' + e.message, convCount: 0 }); return; }
                    if (!Array.isArray(data)) { resolve({ valid: false, reason: '顶层不是数组', convCount: 0 }); return; }
                    if (!data.length) { resolve({ valid: false, reason: '空数组，无任何会话', convCount: 0 }); return; }
                    // 抽样校验第一个元素，必须有 messages 字段
                    const first = data[0];
                    if (!first || typeof first !== 'object' || !Array.isArray(first.messages)) {
                        resolve({ valid: false, reason: '数组元素缺少 messages 字段，不是 raw patch 格式', convCount: 0 }); return;
                    }
                    resolve({ valid: true, reason: '', convCount: data.length });
                } catch (e) {
                    resolve({ valid: false, reason: '读取失败：' + e.message, convCount: 0 });
                }
            });
        }
        function renderMergeFileList() {
            const list = $('mergeFileList');
            if (!mergeState.files.length) {
                list.innerHTML = `<div style="color:var(--muted); font-size:.8rem; padding:20px; text-align:center;">尚未选择任何文件</div>`;
                $('mergeDo').disabled = true;
                $('mergeWarnings').style.display = 'none';
                return;
            }
            let totalSize = 0, validCount = 0, warnMsgs = [];
            const items = mergeState.files.map((f, i) => {
                totalSize += f.size;
                if (f.valid) validCount++;
                return `<div style="display:flex; align-items:center; gap:8px; padding:4px 2px; border-bottom:1px dashed var(--border);">` +
                    `<span style="color:var(--muted); font-size:.72rem; width:18px;">${i + 1}</span>` +
                    `<div style="flex:1; min-width:0;">` +
                    `<div style="font-size:.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHTML(f.name)}</div>` +
                    `<div style="font-size:.72rem; color:${f.valid ? 'var(--muted)' : '#b91c1c'};">` +
                    (f.valid ? `${fmtSize(f.size)} · ${f.convCount} 条会话` : `${fmtSize(f.size)} · ❌ ${escapeHTML(f.reason)}`) +
                    `</div></div>` +
                    `<button data-mi="${i}" style="border:none; background:none; color:#b91c1c; cursor:pointer; font-size:.9rem;" title="移除">×</button>` +
                    `</div>`;
            });
            list.innerHTML = items.join('');
            $('mergeDo').disabled = validCount === 0;
            // OOM 警告
            $('mergeWarnings').style.display = 'none';
            mergeState.files.forEach(f => {
                if (f.size > 200 * 1048576) warnMsgs.push(`⚠ 文件 ${escapeHTML(f.name)} 超过 200MB，浏览器合并时内存压力较大，建议分批处理`);
            });
            if (totalSize > 500 * 1048576) warnMsgs.push(`⚠ 已选文件总大小 ${fmtSize(totalSize)}，接近浏览器内存上限，强烈建议分批处理`);
            if (warnMsgs.length) {
                $('mergeWarnings').innerHTML = `<div style="background:#fef3c7; border:1px solid #fde68a; border-radius:6px; padding:8px 12px; font-size:.78rem; color:#92400e;">` +
                    warnMsgs.join('<br>') + `</div>`;
                $('mergeWarnings').style.display = 'block';
            }
            // 绑定每一项的移除按钮
            list.querySelectorAll('button[data-mi]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const mi = Number(btn.dataset.mi);
                    mergeState.files.splice(mi, 1);
                    renderMergeFileList();
                });
            });
        }

        // 事件：打开合并面板
        $('btnMergeRaw').addEventListener('click', () => {
            mergeState.files = [];
            mergeState.merged = null;
            mergeState.dedup = $('mergeDedup').checked;
            renderMergeFileList();
            $('mergeProgress').textContent = '';
            $('mergeModal').hidden = false;
        });
        $('mergeCancel').addEventListener('click', () => { $('mergeModal').hidden = true; });

        // 事件：选择文件
        $('mergeAddFiles').addEventListener('click', () => $('mergeFileInput').click());
        $('mergeClearAll').addEventListener('click', () => { mergeState.files = []; renderMergeFileList(); });
        $('mergeFileInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            e.target.value = '';
            // 先展示文件壳子（名字/大小），再异步校验
            const pre = files.map(f => ({ file: f, name: f.name, size: f.size, valid: null, reason: '', convCount: 0 }));
            mergeState.files.push(...pre);
            renderMergeFileList();
            // 逐个校验，实时更新状态
            for (let i = mergeState.files.length - pre.length, j = 0; j < pre.length; i++, j++) {
                $('mergeProgress').textContent = `正在校验 ${j + 1}/${pre.length}：${pre[j].name}`;
                const r = await validateMergeFile(pre[j].file);
                mergeState.files[i].valid = r.valid;
                mergeState.files[i].reason = r.reason;
                mergeState.files[i].convCount = r.convCount;
                renderMergeFileList();
            }
            $('mergeProgress').textContent = '校验完毕';
        });
        $('mergeDedup').addEventListener('change', () => { mergeState.dedup = $('mergeDedup').checked; });

        // 事件：执行合并
        $('mergeDo').addEventListener('click', async () => {
            const validFiles = mergeState.files.filter(f => f.valid);
            if (!validFiles.length) return;
            const dedup = mergeState.dedup;
            $('mergeDo').disabled = true;
            $('mergeProgress').textContent = `开始合并 ${validFiles.length} 个文件...`;

            const all = [];
            const seen = dedup ? new Set() : null;
            const stats = { totalFiles: validFiles.length, totalRead: 0, skippedDup: 0, skippedBad: 0, perFile: [] };

            for (let i = 0; i < validFiles.length; i++) {
                const f = validFiles[i];
                $('mergeProgress').textContent = `处理 ${i + 1}/${validFiles.length}：${f.name}`;
                try {
                    const text = await f.file.text();
                    const data = JSON.parse(text);  // 已校验过，这里不会炸
                    let fileAdd = 0, fileDup = 0, fileBad = 0;
                    for (const conv of data) {
                        if (!conv || typeof conv !== 'object' || !Array.isArray(conv.messages)) {
                            fileBad++; continue;
                        }
                        if (seen) {
                            const h = convHash(conv);
                            if (h === null || seen.has(h)) { fileDup++; continue; }
                            seen.add(h);
                        }
                        all.push(conv);
                        fileAdd++;
                    }
                    stats.perFile.push({ name: f.name, read: data.length, added: fileAdd, dup: fileDup, bad: fileBad });
                    stats.totalRead += data.length; stats.skippedDup += fileDup; stats.skippedBad += fileBad;
                } catch (err) {
                    stats.perFile.push({ name: f.name, error: err.message });
                }
            }

            mergeState.merged = all;
            $('mergeProgress').textContent = `合并完成，总 ${all.length} 条`;
            $('mergeDo').disabled = false;

            // 展示结果
            const body = [];
            body.push(`✅ 成功合并 <b>${stats.totalFiles}</b> 个文件，共读取 <b>${stats.totalRead}</b> 条会话`);
            if (dedup) {
                body.push(`🔁 自动去重后保留 <b>${all.length}</b> 条（重复 <b>${stats.skippedDup}</b> 条，损坏 <b>${stats.skippedBad}</b> 条）`);
            } else {
                body.push(`🔁 保留 <b>${all.length}</b> 条（损坏 <b>${stats.skippedBad}</b> 条已跳过）`);
            }
            // 每个文件的小统计
            const fileStatsHtml = stats.perFile.map(p => {
                if (p.error) return `<div style="color:#b91c1c">❌ ${escapeHTML(p.name)}：${escapeHTML(p.error)}</div>`;
                const parts = [`${p.read} 条`];
                if (dedup) parts.push(`新增 ${p.added}`, `重复 ${p.dup}${p.bad ? `，损坏 ${p.bad}` : ''}`);
                else if (p.bad) parts.push(`损坏 ${p.bad}`);
                return `<div>• ${escapeHTML(p.name)}：${parts.join(' · ')}</div>`;
            }).join('');
            body.push(`<div style="margin-top:8px; font-size:.78rem; color:var(--muted);">${fileStatsHtml}</div>`);
            $('mergeResultBody').innerHTML = body.join('<br>');
            $('mergeResultTitle').textContent = all.length ? '合并完成' : '合并结果为空';
            $('mergeResultExport').disabled = !all.length;
            $('mergeModal').hidden = true;
            $('mergeResultModal').hidden = false;
        });

        // 合并结果弹窗
        $('mergeResultClose').addEventListener('click', () => {
            $('mergeResultModal').hidden = true;
            mergeState.merged = null;
        });
        $('mergeResultExport').addEventListener('click', async () => {
            if (!mergeState.merged) return;
            const payload = JSON.stringify(mergeState.merged, null, 2);
            const blob = new Blob([payload], { type: 'application/json' });
            const d = new Date();
            const p2 = n => String(n).padStart(2, '0');
            const ts = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
            const fname = `merged_patch_raw_${ts}.json`;
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: fname,
                        types: [{ description: '合并后的 Raw Patch JSON', accept: { 'application/json': ['.json'] } }],
                    });
                    const w = await handle.createWritable();
                    await w.write(blob); await w.close();
                    return;
                } catch (err) { if (err && err.name === 'AbortError') return; }
            }
            const a = el('a');
            a.href = URL.createObjectURL(blob); a.download = fname;
            a.click(); URL.revokeObjectURL(a.href);
        });

        /* ---------- 导出逻辑 ---------- */
        $('btnExportData').addEventListener('click', () => {
            if (!getAnnotator()) {
                openAnnotatorModal(() => { $('btnExportData').click(); });
                return;
            }
            if (state.edits.size === 0) {
                alert('当前没有任何修改内容可以导出。');
                return;
            }
            $('chkExportFull').checked = true;
            $('chkExportPatch').checked = true;
            $('exportModal').hidden = false;
        });

        $('exportCancel').addEventListener('click', () => {
            $('exportModal').hidden = true;
        });

        $('exportOk').addEventListener('click', () => {
            const doFull = $('chkExportFull').checked;
            const doPatch = $('chkExportPatch').checked;

            if (!doFull && !doPatch) {
                alert('请至少勾选一种导出格式！');
                return;
            }

            $('exportModal').hidden = true;
            executeExport(doFull, doPatch);
        });

        function executeExport(doFull, doPatch) {
            const annotator = getAnnotator();
            const d = new Date();
            const p2 = n => String(n).padStart(2, '0');
            const ts = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
            const baseName = String(state.fileName || 'data').replace(/\.json$/i, '').replace(/[\\/:*?"<>|]/g, '_');
            const safeAnnotator = String(annotator || 'unknown').replace(/[\\/:*?"<>|]/g, '_');

            let downloadCount = 0;
            let exportedFiles = [];

            if (doFull) {
                const fullData = JSON.parse(JSON.stringify(state.data));
                state.edits.forEach((content, key) => {
                    const [ci, mi] = key.split(':').map(Number);
                    if (ci >= 0 && ci < fullData.length && mi >= 0 && mi < fullData[ci].messages.length) {
                        fullData[ci].messages[mi].content = content;
                    }
                });
                const blobFull = new Blob([JSON.stringify(fullData, null, 2)], { type: 'application/json' });
                const fnameFull = `full_${baseName}_${safeAnnotator}_${ts}.json`;
                triggerDownload(blobFull, fnameFull);
                exportedFiles.push(fnameFull);
                downloadCount++;
            }

            if (doPatch) {
                const modifiedConvIndices = new Set();
                state.edits.forEach((content, key) => {
                    const [ci, mi] = key.split(':').map(Number);
                    if (Number.isInteger(ci)) modifiedConvIndices.add(ci);
                });

                const changesData = [];
                modifiedConvIndices.forEach((ci) => {
                    if (ci < 0 || ci >= state.data.length) return;
                    const conv = JSON.parse(JSON.stringify(state.data[ci]));
                    state.edits.forEach((content, key) => {
                        const [editCi, editMi] = key.split(':').map(Number);
                        if (editCi === ci && editMi >= 0 && editMi < conv.messages.length) {
                            conv.messages[editMi].content = content;
                        }
                    });
                    changesData.push(conv);
                });

                const payload = {
                    source: state.fileName,
                    data_sig: state.dataSig,
                    annotator: annotator,
                    exported_at: new Date().toISOString(),
                    edit_count: changesData.length,
                    conversations: changesData
                };
                const blobAudit = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const fnameAudit = `patch_audit_${baseName}_${safeAnnotator}_${ts}.json`;

                const blobRaw = new Blob([JSON.stringify(changesData, null, 2)], { type: 'application/json' });
                const fnameRaw = `patch_raw_${baseName}_${safeAnnotator}_${ts}.json`;

                triggerDownload(blobAudit, fnameAudit);
                setTimeout(() => triggerDownload(blobRaw, fnameRaw), 500);
                exportedFiles.push(fnameAudit, fnameRaw);
                downloadCount += 2;
            }

            resetAfterExport();

            let msg = `已成功导出 ${downloadCount} 个文件！\n\n`;
            exportedFiles.forEach(f => msg += `- ${f}\n`);
            msg += `\n如果只看到了部分文件，请点击浏览器地址栏右侧的“允许下载多个文件”的提示。\n\n[提示] 导出成功后，当前页面的修改痕迹已清空，浏览器暂存已清理。`;
            alert(msg);
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        /* ---------- 事件绑定 ---------- */
        $('convList').addEventListener('click', e => {
            const item = e.target.closest('.conv-item');
            if (item) selectConv(Number(item.dataset.ci));
        });
        $('btnAnnotator').addEventListener('click', () => openAnnotatorModal(null));
        updateAnnotatorUI();
        $('filter').addEventListener('change', renderSidebar);

        (function () {
            const p = new URLSearchParams(location.search).get('data');
            if (!p) return;
            fetch(p).then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            }).then(data => loadData(data, p.split('/').pop()))
                .catch(err => alert('自动加载失败：' + err.message));
        })();

        $('btnOpen').addEventListener('click', () => $('fileInput').click());
        $('fileInput').addEventListener('change', e => {
            const f = e.target.files[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
                try { loadData(JSON.parse(reader.result), f.name); }
                catch (err) { alert('文件不是合法 JSON：' + err.message); }
            };
            reader.readAsText(f);
            e.target.value = '';
        });

        window.addEventListener('beforeunload', () => {
            if (state.data) {
                if (state.edits.size > 0) {
                    localStorage.setItem(storageKey(), JSON.stringify([...state.edits]));
                } else {
                    localStorage.removeItem(storageKey());
                }
            }
        });

    </script>
</body>

</html>
