<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>话术微调标注工具</title>
    <!-- 引入 JSZip 用于打包导出和解压 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --border: #e5e7eb;
            --bg: #f9fafb;
            --card: #ffffff;
            --text: #111827;
            --text2: #6b7280;
            --user: #2563eb;
            --asst: #059669;
            --warn: #f59e0b;
            --pink: #ec4899;
            --pink-bg: #fdf2f8;
        }

        * {
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            gap: .8rem;
            padding: .55rem 1rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.05rem;
            white-space: nowrap;
        }

        #progressText {
            flex: 1;
            font-size: .85rem;
            color: var(--text2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        button {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: .42rem .9rem;
            cursor: pointer;
            font-size: .85rem;
            white-space: nowrap;
        }

        button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        button.secondary {
            background: #fff;
            color: var(--text);
            border: 1px solid var(--border);
        }

        button.link {
            background: none;
            color: var(--primary);
            padding: 0;
            font-size: .75rem;
        }

        button.danger-link {
            background: none;
            color: #ef4444;
            padding: 0;
            font-size: .75rem;
            cursor: pointer;
        }

        button.link:hover,
        button.danger-link:hover {
            text-decoration: underline;
        }

        /* 弹窗通用 */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .35);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal-mask[hidden] {
            display: none;
        }

        .modal {
            background: #fff;
            border-radius: 8px;
            padding: 18px 20px;
            width: 320px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .18);
        }

        .modal h3 {
            font-size: .95rem;
            margin-bottom: 4px;
        }

        .modal-tip {
            font-size: .78rem;
            color: var(--text2);
            margin-bottom: 10px;
        }

        .modal input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 6px 9px;
            font-size: .88rem;
            margin-bottom: 12px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .layout {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        aside {
            width: 270px;
            border-right: 1px solid var(--border);
            background: var(--card);
            display: flex;
            flex-direction: column;
        }

        .side-tools {
            padding: .6rem;
            display: flex;
            gap: .4rem;
            border-bottom: 1px solid var(--border);
        }

        .side-tools select {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: .85rem;
            background: #fff;
        }

        .conv-list {
            flex: 1;
            overflow-y: auto;
        }

        .conv-item {
            padding: .5rem .7rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .conv-item:hover {
            background: var(--bg);
        }

        .conv-item.active {
            background: #eef2ff;
            border-left: 3px solid var(--primary);
        }

        .conv-item .meta {
            font-size: .75rem;
            color: var(--text2);
            display: flex;
            gap: .45rem;
            align-items: center;
        }

        .conv-item .preview {
            font-size: .8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
            margin-top: .15rem;
        }

        .badge {
            background: var(--warn);
            color: #fff;
            border-radius: 8px;
            font-size: .7rem;
            padding: 0 .35rem;
        }

        .badge.gray {
            background: var(--text2);
        }

        .badge-pink {
            background: var(--pink);
            color: #fff;
            border-radius: 4px;
            font-size: .68rem;
            padding: .05rem .35rem;
            margin-left: 6px;
            font-weight: bold;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.5rem 3rem;
        }

        .empty {
            color: var(--text2);
            text-align: center;
            margin-top: 4rem;
            line-height: 2;
        }

        .conv-header {
            display: flex;
            align-items: center;
            gap: .8rem;
            margin-bottom: .9rem;
            flex-wrap: wrap;
            position: sticky;
            top: -1rem;
            background: var(--bg);
            padding: .5rem 0;
            z-index: 10;
        }

        .conv-header .title {
            font-weight: 600;
            flex: 1;
        }

        .conv-header button {
            padding: .3rem .7rem;
            font-size: .8rem;
        }

        .search-group {
            display: flex;
            align-items: center;
            gap: .35rem;
        }

        .search-group input {
            padding: .3rem .55rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: .85rem;
            width: 220px;
        }

        .search-group button {
            padding: .3rem .55rem;
        }

        .search-group .count {
            font-size: .78rem;
            color: var(--text2);
            min-width: 3.5em;
            text-align: center;
        }

        .replace-group {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
        }

        .replace-group input {
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 3px 7px;
            font-size: .8rem;
            width: 160px;
        }

        .replace-group button {
            padding: 3px 8px;
            font-size: .78rem;
        }

        .replace-group .btn-replace {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .replace-group .btn-undo {
            background: #fff;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 5px;
            cursor: pointer;
        }

        .replace-group .btn-undo:disabled {
            color: #d1d5db;
            border-color: #e5e7eb;
            cursor: not-allowed;
        }

        .sys-card,
        .turn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: .9rem;
            overflow: hidden;
        }

        .turn {
            transition: border-color 0.2s ease;
        }

        .turn.is-new-turn {
            border-color: #fbcfe8;
            background-color: var(--pink-bg);
        }

        .sys-head,
        .turn-head {
            padding: .4rem .8rem;
            font-size: .8rem;
            color: var(--text2);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: .5rem;
            align-items: center;
        }

        .is-new-turn .turn-head {
            border-bottom-color: #fbcfe8;
            color: var(--pink);
        }

        .sys-body {
            padding: .6rem .8rem;
            white-space: pre-wrap;
            font-size: .85rem;
            color: var(--text2);
            max-height: 5.6em;
            overflow: hidden;
        }

        .sys-body.expanded {
            max-height: none;
        }

        .lock {
            font-size: .75rem;
        }

        .msg {
            border-top: 1px solid var(--border);
        }

        .msg:first-child {
            border-top: none;
        }

        .msg-head {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .4rem .8rem 0;
            font-size: .78rem;
            color: var(--text2);
        }

        .msg-head .spacer {
            flex: 1;
        }

        .role {
            font-weight: 600;
            padding: .05rem .45rem;
            border-radius: 6px;
            color: #fff;
            font-size: .72rem;
        }

        .role.user {
            background: var(--user);
        }

        .role.assistant {
            background: var(--asst);
        }

        .role.other {
            background: var(--text2);
        }

        .ta-wrap {
            position: relative;
        }

        .ta-wrap .backdrop {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            padding: .35rem .8rem .7rem;
            font: inherit;
            font-size: .9rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            color: transparent;
        }

        .ta-wrap mark {
            background: #fde68a;
            border-radius: 2px;
        }

        .msg textarea {
            position: relative;
            display: block;
            width: 100%;
            border: none;
            resize: none;
            outline: none;
            padding: .35rem .8rem .7rem;
            font: inherit;
            font-size: .9rem;
            line-height: 1.55;
            background: transparent;
            overflow: hidden;
        }

        .ta-wrap mark.d {
            background: #bbf7d0;
        }

        .sys-body mark {
            background: #fde68a;
            border-radius: 2px;
        }

        .cur-match .hl mark {
            background: #fdba74;
        }

        mark,
        [data-key] {
            scroll-margin-top: 4rem;
        }

        .msg .mod-badge {
            display: none;
        }

        .msg.modified .mod-badge {
            display: inline;
        }

        .msg .only-mod {
            visibility: hidden;
        }

        .msg.modified .only-mod {
            visibility: visible;
        }

        .orig {
            display: none;
            margin: 0 .8rem .7rem;
            padding: .5rem .7rem;
            background: var(--bg);
            border: 1px dashed var(--border);
            border-radius: 6px;
            font-size: .8rem;
            color: var(--text2);
            white-space: pre-wrap;
        }

        .orig.show {
            display: block;
        }

        /* 批量替换预览弹窗 */
        .modal-preview {
            max-height: 50vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: .82rem;
            line-height: 1.55;
        }

        .modal-preview .diff-item {
            padding: 6px 0;
            border-bottom: 1px dashed var(--border);
        }

        .modal-preview .diff-item:last-child {
            border-bottom: none;
        }

        .modal-preview .diff-key {
            color: var(--text2);
            font-size: .72rem;
            margin-bottom: 2px;
        }

        .modal-preview .old {
            color: #b91c1c;
            text-decoration: line-through;
        }

        .modal-preview .sep {
            color: var(--text2);
            margin: 0 6px;
        }

        .modal-preview .new {
            color: #047857;
            background: #d1fae5;
            padding: 0 2px;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <header>
        <h1>话术微调标注</h1>
        <span id="progressText">未加载数据</span>
        <button id="btnAnnotator" class="secondary" title="点击修改标注人">标注人：未设置</button>
        <button id="btnOpen">打开数据文件</button>
        <button id="btnExportZip" disabled>一键交卷</button>
        <button id="btnMergeTool" class="secondary">合并补丁</button>
    </header>

    <div class="layout">
        <aside>
            <div class="side-tools">
                <select id="filter" disabled>
                    <option value="all">全部</option>
                    <option value="modified">已修改</option>
                    <option value="unmodified">未修改</option>
                </select>
            </div>
            <div id="convList" class="conv-list"></div>
        </aside>
        <main id="main">
            <div class="empty">请点击右上角「打开数据文件」加载原始对话 JSON</div>
        </main>
    </div>

    <input type="file" id="fileInput" accept=".json" hidden>

    <!-- 弹窗：标注人署名 -->
    <div id="annotatorModal" class="modal-mask" hidden>
        <div class="modal">
            <h3>填写标注人</h3>
            <p class="modal-tip">姓名将写入文件名，便于追溯；只需填写一次</p>
            <input id="annotatorInput" type="text" placeholder="如：张三" maxlength="20">
            <div class="modal-actions">
                <button id="annotatorCancel" class="secondary">取消</button>
                <button id="annotatorOk">确定</button>
            </div>
        </div>
    </div>

    <!-- 弹窗：批量替换预览 -->
    <div id="replaceModal" class="modal-mask" hidden>
        <div class="modal" style="width: 460px;">
            <h3>批量替换预览</h3>
            <p class="modal-tip" id="replaceSummary"></p>
            <div id="replacePreview" class="modal-preview"></div>
            <div class="modal-actions">
                <button id="replaceCancel" class="secondary">取消</button>
                <button id="replaceOk">确认替换</button>
            </div>
        </div>
    </div>

    <!-- 弹窗：补丁合并工具 (纯拼接) -->
    <div id="mergeToolModal" class="modal-mask" hidden>
        <div class="modal" style="width: 500px;">
            <h3>合并补丁文件</h3>
            <p class="modal-tip">
                选择所有要合并的交卷压缩包 (.zip) 或补丁文件 (.json)。<br>
                系统会自动提取其中的会话并拼接成一个长数组。
            </p>

            <div style="margin: 15px 0;">
                <button id="btnMergeSelectPatches" class="secondary">选择补丁文件 (支持多选)</button>
                <span id="mergePatchesCount" style="font-size: 0.8rem; color: var(--text2); margin-left: 8px;">已选 0
                    个</span>
                <input type="file" id="mergePatchesInput" accept=".zip,.json" multiple hidden>
            </div>

            <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 6px;">
                <input type="checkbox" id="mergeDedup" checked style="width: 16px; height: 16px; cursor: pointer;">
                <label for="mergeDedup"
                    style="font-size: 0.85rem; cursor: pointer; user-select: none;">自动去重（剔除完全相同的会话）</label>
            </div>

            <div id="mergeToolLog"
                style="font-size: 0.78rem; color: #047857; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 6px; padding: 10px; margin-bottom: 12px; min-height: 40px; max-height: 120px; overflow-y: auto; display: none;">
            </div>

            <div class="modal-actions">
                <button id="mergeToolCancel" class="secondary">关闭</button>
                <button id="btnMergeDo" disabled>开始合并并下载</button>
            </div>
        </div>
    </div>

    <script>
        // ----- 核心状态 -----
        const state = {
            data: null, fileName: '', totalMsgs: 0, dataSig: '',
            edits: new Map(),             // 普通文本修改 "ci:mi" -> content
            structuralEdits: new Map(),   // 结构性修改 ci -> 修改后的整个 messages 数组
            current: -1,
            searchText: null,
            lastBatch: null,
            hasExported: false,
        };
        const search = { q: '', matches: [], cur: -1 };
        const $ = id => document.getElementById(id);
        const keyOf = (ci, mi) => ci + ':' + mi;
        const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };

        // ----- 数据加载与校验 -----
        function validateData(data) {
            const errors = [];
            if (!Array.isArray(data)) return ['顶层结构不是 JSON 数组'];
            data.forEach((conv, i) => {
                const msgs = conv && conv.messages;
                if (!Array.isArray(msgs) || msgs.length === 0) { errors.push(`会话 ${i}: messages 缺失或为空`); return; }
                const roles = [];
                msgs.forEach((m, j) => {
                    if (!m || typeof m.role !== 'string' || typeof m.content !== 'string') {
                        errors.push(`会话 ${i} 消息 ${j}: 缺少 role 或 content 字段`); return;
                    }
                    roles.push(m.role);
                });
                if (!roles.length) return;
                if (roles[0] !== 'system') errors.push(`会话 ${i}: 首条消息不是 system`);
                else if (roles.filter(r => r === 'system').length > 1) errors.push(`会话 ${i}: 存在多条 system 消息`);
                for (let j = 1; j < roles.length; j++) {
                    const expect = j % 2 === 1 ? 'user' : 'assistant';
                    if (roles[j] !== 'user' && roles[j] !== 'assistant') errors.push(`会话 ${i} 消息 ${j}: 非法角色 ${roles[j]}`);
                    else if (roles[j] !== expect) errors.push(`会话 ${i} 消息 ${j}: 应为 ${expect}，实际为 ${roles[j]}`);
                }
                if ((roles.length - 1) % 2 !== 0) errors.push(`会话 ${i}: 非 system 消息数为奇数，存在未配对轮次`);
            });
            return errors;
        }

        function loadData(data, fileName) {
            const errors = validateData(data);
            if (errors.length) {
                alert('数据结构校验未通过，共 ' + errors.length + ' 处问题：\n' + errors.slice(0, 10).join('\n') + (errors.length > 10 ? '\n...' : ''));
                return;
            }
            state.data = data;
            state.fileName = fileName;
            state.totalMsgs = data.reduce((s, c) => s + c.messages.length, 0);

            const sysLen = data.length && data[0].messages.length ? data[0].messages[0].content.length : 0;
            const lastMsgs = data.length ? data[data.length - 1].messages : [];
            const lastLen = lastMsgs.length ? lastMsgs[lastMsgs.length - 1].content.length : 0;
            state.dataSig = `${data.length}:${state.totalMsgs}:${sysLen}:${lastLen}`;

            state.edits = new Map();
            state.structuralEdits = new Map();
            state.current = -1;
            state.searchText = null;
            search.q = ''; search.matches = []; search.cur = -1;
            state.hasExported = false;

            restoreEdits();
            $('filter').disabled = false;
            $('btnExportZip').disabled = false;
            renderSidebar();
            selectConv(0);
            updateProgress();
        }

        // ----- 本地暂存 -----
        function storageKey() { return `pair_annotator:${state.fileName}:${state.data.length}:${state.totalMsgs}`; }
        let saveTimer = null;
        function scheduleSave() {
            clearTimeout(saveTimer);
            if (state.hasExported) return;
            saveTimer = setTimeout(() => {
                if (state.edits.size > 0 || state.structuralEdits.size > 0) {
                    localStorage.setItem(storageKey(), JSON.stringify({
                        edits: [...state.edits],
                        structuralEdits: [...state.structuralEdits]
                    }));
                } else {
                    localStorage.removeItem(storageKey());
                }
            }, 300);
        }
        function restoreEdits() {
            try {
                const raw = localStorage.getItem(storageKey());
                if (raw) {
                    const parsed = JSON.parse(raw);
                    state.edits = new Map(parsed.edits || []);
                    state.structuralEdits = new Map(parsed.structuralEdits || []);
                }
            } catch (e) { /* 忽略 */ }
        }
        function resetAfterExport() {
            clearTimeout(saveTimer);
            state.hasExported = true;
            state.edits.clear();
            state.structuralEdits.clear();
            state.lastBatch = null;
            localStorage.removeItem(storageKey());
            const ri = $('replaceInput');
            if (ri) ri.value = '';
            renderSidebar();
            if (state.current >= 0) selectConv(state.current);
            updateProgress();
        }

        // ----- 侧栏渲染 -----
        function convEditCount(ci) {
            let n = 0;
            if (state.structuralEdits.has(ci)) return 1; // 结构变了视为有一处修改
            for (const k of state.edits.keys()) if (Number(k.split(':')[0]) === ci) n++;
            return n;
        }
        function buildSearchText() {
            state.searchText = state.data.map((c, ci) => {
                const msgs = getConvMessages(ci);
                return msgs.map((m, mi) => currentContentOf(ci, mi)).join('\n').toLowerCase();
            });
        }
        function renderSidebar() {
            const list = $('convList');
            const q = search.q.trim().toLowerCase();
            const filter = $('filter').value;
            if (q && !state.searchText) buildSearchText();
            const html = [];
            state.data.forEach((conv, i) => {
                const mod = convEditCount(i);
                if (filter === 'modified' && !mod) return;
                if (filter === 'unmodified' && mod) return;
                if (q && !String(i).includes(q) && !state.searchText[i].includes(q)) return;

                let previewMsgs = getConvMessages(i);
                const firstUser = previewMsgs.find(m => m.role === 'user');
                const preview = firstUser ? firstUser.content : '(无 user 消息)';

                html.push(
                    `<div class="conv-item${i === state.current ? ' active' : ''}" data-ci="${i}">` +
                    `<div class="meta"><span>#${i}</span><span>${(previewMsgs.length - 1) / 2} 轮</span>` +
                    (mod ? `<span class="badge">改 ${mod}</span>` : '') +
                    `</div><div class="preview">${escapeHTML(preview)}</div></div>`
                );
            });
            list.innerHTML = html.join('');
        }
        function refreshSidebarItem(ci) {
            const item = $('convList').querySelector(`[data-ci="${ci}"]`);
            if (!item) return;
            const meta = item.querySelector('.meta');
            const old = meta.querySelector('.badge');
            if (old) old.remove();
            const mod = convEditCount(ci);
            if (mod) { const b = el('span', 'badge'); b.textContent = '改 ' + mod; meta.append(b); }
        }

        // ----- 主区域渲染 -----
        function selectConv(i) {
            if (!state.data || i < 0 || i >= state.data.length) return;
            state.current = i;
            document.querySelectorAll('.conv-item.active').forEach(e => e.classList.remove('active'));
            const item = $('convList').querySelector(`[data-ci="${i}"]`);
            if (item) { item.classList.add('active'); item.scrollIntoView({ block: 'nearest' }); }
            renderMain();
        }

        function getConvMessages(ci) {
            if (state.structuralEdits.has(ci)) return state.structuralEdits.get(ci);
            return state.data[ci].messages;
        }

        function renderMain() {
            const main = $('main');
            main.textContent = '';
            const ci = state.current;
            const msgs = getConvMessages(ci);

            const head = el('div', 'conv-header');
            const sg = el('div', 'search-group');
            const si = el('input'); si.id = 'mainSearch'; si.placeholder = '搜索关键词/短句（Enter 下一个）';
            si.value = search.q;
            let searchTimer = null;
            si.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => doSearch(true), 250); });
            si.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); doSearch(e.shiftKey ? 'prev' : 'next'); }
            });
            const btnUp = el('button'); btnUp.textContent = '↑'; btnUp.title = '上一个匹配';
            btnUp.addEventListener('click', () => jumpToMatch(search.cur - 1));
            const btnDown = el('button'); btnDown.textContent = '↓'; btnDown.title = '下一个匹配';
            btnDown.addEventListener('click', () => jumpToMatch(search.cur + 1));
            const cnt = el('span', 'count'); cnt.id = 'matchCount';
            sg.append(si, btnUp, btnDown, cnt);

            const rg = el('div', 'replace-group');
            const ri = el('input'); ri.id = 'replaceInput'; ri.placeholder = '替换为';
            ri.addEventListener('keydown', e => { if (e.key === 'Enter') doBatchReplace(); });
            const bRep = el('button', 'btn-replace'); bRep.textContent = '批量替换';
            bRep.addEventListener('click', doBatchReplace);
            const bUndo = el('button', 'btn-undo'); bUndo.textContent = '↶ 撤销上一批';
            bUndo.disabled = !state.lastBatch;
            bUndo.addEventListener('click', undoLastBatch);
            rg.append(ri, bRep, bUndo);
            sg.append(rg);

            const btnPrev = el('button'); btnPrev.textContent = '← 上一条'; btnPrev.disabled = ci === 0;
            btnPrev.addEventListener('click', () => selectConv(ci - 1));
            const btnNext = el('button'); btnNext.textContent = '下一条 →'; btnNext.disabled = ci === state.data.length - 1;
            btnNext.addEventListener('click', () => selectConv(ci + 1));
            const title = el('span', 'title');
            title.textContent = `会话 #${ci}（共 ${(msgs.length - 1) / 2} 轮）`;
            head.append(sg, title, btnPrev, btnNext);
            main.append(head);

            // system 卡片（保护逻辑：永远只读，不可删除）
            const sysCard = el('div', 'sys-card');
            sysCard.dataset.key = ci + ':0';
            const sysHead = el('div', 'sys-head');
            const lock = el('span', 'lock'); lock.textContent = '🔒 system（只读）';
            const toggle = el('button', 'link'); toggle.textContent = '展开';
            sysHead.append(lock, toggle);
            const sysBody = el('div', 'sys-body');
            sysBody.textContent = msgs[0].content;
            toggle.addEventListener('click', () => {
                sysBody.classList.toggle('expanded');
                toggle.textContent = sysBody.classList.contains('expanded') ? '收起' : '展开';
            });
            sysCard.append(sysHead, sysBody);
            main.append(sysCard);

            // 轮次列表
            let turnCount = 1;
            for (let mi = 1; mi < msgs.length; mi += 2) {
                const isNew = msgs[mi].__is_new || (msgs[mi + 1] && msgs[mi + 1].__is_new);
                const card = el('div', 'turn' + (isNew ? ' is-new-turn' : ''));

                const th = el('div', 'turn-head');
                const label = el('span');
                label.textContent = `第 ${turnCount} 轮`;

                th.append(label);

                if (isNew) {
                    const nb = el('span', 'badge-pink');
                    nb.textContent = '新增';
                    th.append(nb);
                }

                const spacer = el('div'); spacer.style.flex = '1';
                th.append(spacer);

                // 插入按钮（在此轮下方插入）
                const btnInsert = el('button', 'link');
                btnInsert.textContent = '＋ 下方插入';
                btnInsert.title = '在此轮下方插入一对新的问答';
                btnInsert.addEventListener('click', () => insertTurn(ci, mi + 2));
                th.append(btnInsert);

                // 删除按钮
                const btnDel = el('button', 'danger-link');
                btnDel.style.marginLeft = '8px';
                btnDel.textContent = '🗑 删除';
                btnDel.title = '删除此轮对话（包含 user 和 assistant）';
                // 只剩最后一轮时禁用删除（保证至少有一轮）
                if (msgs.length <= 3) {
                    btnDel.disabled = true;
                    btnDel.style.opacity = 0.3;
                    btnDel.style.cursor = 'not-allowed';
                } else {
                    btnDel.addEventListener('click', () => deleteTurn(ci, mi));
                }
                th.append(btnDel);

                card.append(th);
                card.append(msgBlock(ci, mi));
                if (mi + 1 < msgs.length) card.append(msgBlock(ci, mi + 1));

                main.append(card);
                turnCount++;
            }

            main.querySelectorAll('textarea').forEach(autoResize);
            refreshHighlights();
            updateMatchUI();
        }

        function msgBlock(ci, mi) {
            const msgs = getConvMessages(ci);
            const m = msgs[mi];
            const k = keyOf(ci, mi);

            const isStructural = state.structuralEdits.has(ci);
            let isMod = false;
            let origContent = undefined;

            if (isStructural) {
                if (m.__is_new) {
                    isMod = true; // 新增的轮次本身就代表修改
                } else if (m.__original_content !== undefined) {
                    origContent = m.__original_content;
                    isMod = m.content !== origContent;
                } else {
                    isMod = false;
                }
            } else {
                const edited = state.edits.get(k);
                const origMessage = state.data[ci].messages[mi];
                origContent = origMessage ? origMessage.content : undefined;
                isMod = edited !== undefined && edited !== origContent;
            }

            const wrap = el('div', 'msg' + (isMod ? ' modified' : ''));
            wrap.dataset.key = k;
            const head = el('div', 'msg-head');
            const role = el('span', 'role ' + (m.role === 'user' ? 'user' : m.role === 'assistant' ? 'assistant' : 'other'));
            role.textContent = m.role;
            const idx = el('span'); idx.textContent = '#' + mi;
            head.append(role, idx);
            if ('loss' in m) { const lb = el('span', 'badge gray'); lb.textContent = 'loss: ' + m.loss; head.append(lb); }
            const modBadge = el('span', 'badge mod-badge'); modBadge.textContent = '已修改';
            head.append(modBadge);
            const spacer = el('span', 'spacer'); head.append(spacer);

            if (origContent !== undefined) {
                const btnOrig = el('button', 'link only-mod'); btnOrig.textContent = '原文';
                const btnRevert = el('button', 'link only-mod'); btnRevert.textContent = '还原';
                head.append(btnOrig, btnRevert);
                const orig = el('div', 'orig');
                orig.textContent = origContent;
                btnOrig.addEventListener('click', () => orig.classList.toggle('show'));
                btnRevert.addEventListener('click', () => {
                    ta.value = origContent; autoResize(ta); onEdit(ci, mi, ta, wrap);
                });
                wrap.append(head);
                wrap._origDiv = orig;
            } else {
                wrap.append(head);
            }

            const ta = el('textarea');
            ta.value = m.content; // 统一从 m 中取值
            ta.rows = 1;
            ta.addEventListener('input', () => { autoResize(ta); onEdit(ci, mi, ta, wrap); });

            const taWrap = el('div', 'ta-wrap');
            const bd = el('div', 'backdrop');
            const hl = el('div', 'hl');
            bd.append(hl);
            taWrap.append(bd, ta);

            wrap.append(taWrap);
            if (wrap._origDiv) wrap.append(wrap._origDiv);
            return wrap;
        }

        function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

        // ----- 结构修改逻辑 -----
        function deleteTurn(ci, mi) {
            const msgs = [...getConvMessages(ci)];
            if (msgs.length <= 3) return;
            if (!confirm('确定要删除这一轮对话吗？（包含 user 提问和 assistant 回答）')) return;

            msgs.splice(mi, 2); // 删除 user 和 assistant
            saveStructuralEdit(ci, msgs);
        }

        function insertTurn(ci, insertIndex) {
            const msgs = [...getConvMessages(ci)];
            if (insertIndex < 1) insertIndex = 1;
            if (insertIndex > msgs.length) insertIndex = msgs.length;

            const newUser = { role: 'user', content: '', __is_new: true };
            const newAsst = { role: 'assistant', content: '', loss: 'True', __is_new: true };

            msgs.splice(insertIndex, 0, newUser, newAsst);
            saveStructuralEdit(ci, msgs);
        }

        function saveStructuralEdit(ci, newMsgs) {
            // 给保留的旧消息打上原始内容标记，防止索引偏移导致误判已修改
            newMsgs.forEach(m => {
                if (!m.__is_new && m.__original_content === undefined) {
                    m.__original_content = m.content;
                }
            });

            state.structuralEdits.set(ci, newMsgs);

            // 清理该会话旧的文本修改记录，因为索引已变
            for (const key of [...state.edits.keys()]) {
                if (Number(key.split(':')[0]) === ci) state.edits.delete(key);
            }

            state.hasExported = false;
            renderMain();
            refreshSidebarItem(ci);
            updateProgress();
            scheduleSave();
        }

        // ----- 文本编辑逻辑 -----
        function onEdit(ci, mi, ta, wrap) {
            const msgs = getConvMessages(ci);
            const m = msgs[mi];

            const isStructural = state.structuralEdits.has(ci);

            if (isStructural) {
                m.content = ta.value;
                state.structuralEdits.set(ci, msgs);
            } else {
                const origMessage = state.data[ci].messages[mi];
                const orig = origMessage ? origMessage.content : undefined;
                const k = keyOf(ci, mi);
                if (ta.value !== orig) state.edits.set(k, ta.value);
                else state.edits.delete(k);
            }

            // 重新计算 isMod
            let isMod = false;
            if (m.__is_new) isMod = true;
            else if (m.__original_content !== undefined) isMod = m.content !== m.__original_content;
            else if (!isStructural) {
                const orig = state.data[ci].messages[mi]?.content;
                isMod = ta.value !== orig;
            }

            state.hasExported = false;
            wrap.classList.toggle('modified', isMod);

            const origForHighlight = m.__original_content !== undefined ? m.__original_content : (state.data[ci].messages[mi]?.content);
            const hl = wrap.querySelector('.backdrop .hl');
            if (hl) hl.innerHTML = renderBackdropHTML(ta.value, origForHighlight, search.q);

            refreshSidebarItem(ci);
            updateProgress();
            scheduleSave();
        }

        function updateProgress() {
            if (!state.data) return;
            const convs = new Set([
                ...[...state.edits.keys()].map(k => Number(k.split(':')[0])),
                ...state.structuralEdits.keys()
            ]).size;
            $('progressText').textContent = `${state.fileName} · 已修改会话 ${convs}/${state.data.length}`;
        }

        // ----- 搜索与高亮 -----
        function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        function escapeHTML(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function highlightHTML(text, q) {
            if (!q) return escapeHTML(text) + ' ';
            const re = new RegExp(escapeRegExp(q), 'gi');
            let out = '', last = 0, m;
            while ((m = re.exec(text))) {
                out += escapeHTML(text.slice(last, m.index)) + '<mark>' + escapeHTML(m[0]) + '</mark>';
                last = m.index + m[0].length;
                if (m[0].length === 0) re.lastIndex++;
            }
            return out + escapeHTML(text.slice(last)) + ' ';
        }
        function diffSpan(orig, cur) {
            let s = 0;
            const minLen = Math.min(orig.length, cur.length);
            while (s < minLen && orig[s] === cur[s]) s++;
            let e = cur.length, o = orig.length;
            while (e > s && o > s && orig[o - 1] === cur[e - 1]) { e--; o--; }
            return [s, e];
        }
        function renderBackdropHTML(text, orig, q) {
            const cover = new Array(text.length).fill(null);
            if (orig !== undefined && orig !== text) {
                const [s, e] = diffSpan(orig, text);
                for (let i = s; i < e; i++) cover[i] = 'd';
            }
            if (q) {
                const re = new RegExp(escapeRegExp(q), 'gi');
                let m;
                while ((m = re.exec(text))) {
                    for (let i = m.index; i < m.index + m[0].length; i++) cover[i] = 's';
                    if (m[0].length === 0) re.lastIndex++;
                }
            }
            let out = '', i = 0;
            while (i < text.length) {
                const t = cover[i];
                let j = i;
                while (j < text.length && cover[j] === t) j++;
                const seg = escapeHTML(text.slice(i, j));
                out += t === 's' ? '<mark>' + seg + '</mark>' : t === 'd' ? '<mark class="d">' + seg + '</mark>' : seg;
                i = j;
            }
            return out + ' ';
        }
        function refreshHighlights() {
            if (!state.data || state.current < 0) return;
            const q = search.q;
            const msgs = getConvMessages(state.current);
            const sysBody = $('main').querySelector('.sys-body');
            if (sysBody) {
                const content = msgs[0].content;
                if (q) sysBody.innerHTML = highlightHTML(content, q);
                else sysBody.textContent = content;
            }
            $('main').querySelectorAll('.msg').forEach(wrap => {
                const ta = wrap.querySelector('textarea');
                const hl = wrap.querySelector('.backdrop .hl');
                if (ta && hl) {
                    const [ci, mi] = wrap.dataset.key.split(':').map(Number);
                    const msgs = getConvMessages(ci);
                    const m = msgs[mi];
                    const orig = m.__original_content !== undefined ? m.__original_content : state.data[ci]?.messages[mi]?.content;
                    hl.innerHTML = renderBackdropHTML(ta.value, orig, q);
                }
            });
        }
        function updateMatchUI() {
            const cnt = $('matchCount');
            if (!cnt) return;
            cnt.textContent = search.q ? (search.matches.length ? `${search.cur + 1}/${search.matches.length}` : '无匹配') : '';
        }
        function clearCurMatch() {
            document.querySelectorAll('.cur-match').forEach(e => e.classList.remove('cur-match'));
        }
        function currentContentOf(ci, mi) {
            if (state.structuralEdits.has(ci)) {
                return state.structuralEdits.get(ci)[mi]?.content || '';
            }
            const k = keyOf(ci, mi);
            if (state.edits.has(k)) return state.edits.get(k);
            return state.data[ci].messages[mi]?.content || '';
        }
        function computeMatches(q) {
            const res = [];
            if (!q || !state.data) return res;
            const lq = q.toLowerCase();
            state.data.forEach((conv, ci) => {
                const msgs = getConvMessages(ci);
                msgs.forEach((m, mi) => {
                    if (currentContentOf(ci, mi).toLowerCase().includes(lq)) res.push({ ci, mi });
                });
            });
            return res;
        }
        function doSearch(mode) {
            const si = $('mainSearch');
            const q = si ? si.value : '';
            if (mode === true || q !== search.q) {
                search.q = q;
                search.matches = computeMatches(q);
                search.cur = -1;
                refreshHighlights();
                updateMatchUI();
                renderSidebar();
                if (search.matches.length) jumpToMatch(0);
                else clearCurMatch();
                return;
            }
            if (mode === 'next') jumpToMatch(search.cur + 1);
            else if (mode === 'prev') jumpToMatch(search.cur - 1);
        }
        function jumpToMatch(i) {
            if (!search.matches.length) return;
            search.cur = ((i % search.matches.length) + search.matches.length) % search.matches.length;
            const { ci, mi } = search.matches[search.cur];
            if (ci !== state.current) selectConv(ci);
            clearCurMatch();
            const target = $('main').querySelector(`[data-key="${ci}:${mi}"]`);
            if (!target) { updateMatchUI(); return; }
            target.classList.add('cur-match');
            if (mi === 0) {
                const sysBody = target.querySelector('.sys-body');
                const toggle = target.querySelector('.sys-head .link');
                if (sysBody && !sysBody.classList.contains('expanded')) {
                    sysBody.classList.add('expanded');
                    if (toggle) toggle.textContent = '收起';
                }
            }
            const mark = target.querySelector('.hl mark') || target.querySelector('.sys-body mark') || target;
            mark.scrollIntoView({ block: 'center', behavior: 'auto' });
            updateMatchUI();
            const si = $('mainSearch');
            if (si && document.activeElement !== si) {
                si.focus();
                si.setSelectionRange(si.value.length, si.value.length);
            }
        }

        // ----- 批量替换 -----
        function scanBatchReplace(q, replacement) {
            const result = [];
            if (!q || !state.data) return result;
            state.data.forEach((conv, ci) => {
                const msgs = getConvMessages(ci);
                msgs.forEach((m, mi) => {
                    if (m.role === 'system') return;
                    const old = currentContentOf(ci, mi);
                    if (old.indexOf(q) === -1) return;
                    const rep = old.split(q).join(replacement);
                    if (rep !== old) result.push({ ci, mi, old, new: rep });
                });
            });
            return result;
        }
        let batchPending = null;
        function flashMsg(text) {
            const t = $('progressText'); const old = t.textContent;
            t.textContent = text; setTimeout(() => { t.textContent = old; }, 2200);
        }
        function doBatchReplace() {
            const q = search.q;
            const replacement = $('replaceInput') ? $('replaceInput').value : '';
            if (!q) { flashMsg('请先在搜索框输入关键词'); return; }
            if (replacement === '') { flashMsg('请在「替换为」框里填新内容'); return; }
            const hits = scanBatchReplace(q, replacement);
            if (!hits.length) { flashMsg('没有匹配项'); return; }

            const convIds = new Set(hits.map(h => h.ci));
            $('replaceSummary').textContent = `关键词「${q}」 → 替换为「${replacement}」\n影响 ${convIds.size} 条会话，共 ${hits.length} 处`;
            const pv = $('replacePreview');
            pv.innerHTML = hits.slice(0, 3).map(h => {
                const oldShort = h.old.length > 60 ? h.old.slice(0, 57) + '…' : h.old;
                const newShort = h.new.length > 60 ? h.new.slice(0, 57) + '…' : h.new;
                return `<div class="diff-item"><div class="diff-key">会话 #${h.ci} · 消息 ${h.mi}</div>` +
                    `<div><span class="old"></span>${escapeHTML(oldShort)}</div>` +
                    `<div><span class="sep">→</span><span class="new">${escapeHTML(newShort)}</span></div></div>`;
            }).join('');
            if (hits.length > 3) pv.innerHTML += `<p class="modal-tip" style="margin-top:8px">（还有 ${hits.length - 3} 处未列出）</p>`;
            batchPending = { hits };
            $('replaceModal').hidden = false;
        }
        $('replaceOk') && $('replaceOk').addEventListener('click', () => {
            if (!batchPending) return;
            const { hits } = batchPending;
            const undoEntries = [];
            hits.forEach(({ ci, mi, old, new: rep }) => {
                const msgs = getConvMessages(ci);
                const orig = state.data[ci].messages[mi] ? state.data[ci].messages[mi].content : undefined;

                if (state.structuralEdits.has(ci)) {
                    msgs[mi].content = rep;
                    state.structuralEdits.set(ci, msgs);
                } else {
                    const k = keyOf(ci, mi);
                    if (rep === orig) state.edits.delete(k);
                    else state.edits.set(k, rep);
                }
            });
            batchPending = null;
            $('replaceModal').hidden = true;
            state.hasExported = false;
            renderMain();
            buildSearchText();
            search.matches = computeMatches(search.q);
            search.cur = search.matches.length ? 0 : -1;
            refreshHighlights();
            updateMatchUI();
            updateProgress();
            renderSidebar();
            scheduleSave();
        });
        $('replaceCancel') && $('replaceCancel').addEventListener('click', () => {
            batchPending = null;
            $('replaceModal').hidden = true;
        });
        function undoLastBatch() {
            if (!state.lastBatch) return;
            state.lastBatch.forEach(([k, old, had]) => {
                const [ci, mi] = k.split(':').map(Number);
                if (state.structuralEdits.has(ci)) return;
                const orig = state.data[ci].messages[mi].content;
                if (old === orig) state.edits.delete(k);
                else state.edits.set(k, old);
            });
            state.lastBatch = null;
            renderMain();
            buildSearchText();
            search.matches = computeMatches(search.q);
            refreshHighlights();
            updateProgress();
            renderSidebar();
            scheduleSave();
        }

        // ----- 标注人管理 -----
        let annotatorCallback = null;
        function getAnnotator() { return localStorage.getItem('pair_annotator_annotator') || ''; }
        function sanitizeName(s) { return s.trim().replace(/[\\/:*?"<>|\s]+/g, '_'); }
        function updateAnnotatorUI() { $('btnAnnotator').textContent = '标注人：' + (getAnnotator() || '未设置'); }
        function openAnnotatorModal(cb) {
            annotatorCallback = cb || null;
            $('annotatorInput').value = getAnnotator();
            $('annotatorModal').hidden = false;
            $('annotatorInput').focus();
        }
        function closeAnnotatorModal() { $('annotatorModal').hidden = true; annotatorCallback = null; }
        $('annotatorOk').addEventListener('click', () => {
            const n = sanitizeName($('annotatorInput').value);
            if (!n) { $('annotatorInput').focus(); return; }
            localStorage.setItem('pair_annotator_annotator', n);
            updateAnnotatorUI();
            const cb = annotatorCallback;
            closeAnnotatorModal();
            if (cb) cb();
        });
        $('annotatorCancel').addEventListener('click', closeAnnotatorModal);
        $('annotatorInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') $('annotatorOk').click();
            if (e.key === 'Escape') closeAnnotatorModal();
        });

        // =========================================================
        // 数据清理与导出交卷
        // =========================================================

        // 深度清理内部标记，保证导出干净
        function cleanForExport(msgs) {
            return msgs.map(m => {
                const copy = { ...m };
                delete copy.__is_new;
                delete copy.__original_content;
                return copy;
            });
        }

        async function triggerExportZip() {
            if (!getAnnotator()) { openAnnotatorModal(triggerExportZip); return; }
            if (state.edits.size === 0 && state.structuralEdits.size === 0) { alert('当前没有任何修改内容可以交卷。'); return; }

            const annotator = getAnnotator();
            const d = new Date();
            const p2 = n => String(n).padStart(2, '0');
            const ts = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;

            const baseName = String(state.fileName || 'data').replace(/\.json$/i, '');
            const safeAnnotator = String(annotator).replace(/[\\/:*?"<>|]/g, '_');
            const zipName = `${baseName}_${safeAnnotator}_${ts}.zip`;

            const zip = new JSZip();

            // 1. 生成完整文件 (Full)
            const fullData = JSON.parse(JSON.stringify(state.data));
            // 先应用结构修改
            state.structuralEdits.forEach((msgs, ci) => {
                if (ci >= 0 && ci < fullData.length) {
                    fullData[ci].messages = cleanForExport(msgs);
                }
            });
            // 再应用文本修改
            state.edits.forEach((content, key) => {
                const [ci, mi] = key.split(':').map(Number);
                if (ci >= 0 && ci < fullData.length && mi >= 0 && mi < fullData[ci].messages.length) {
                    fullData[ci].messages[mi].content = content;
                }
            });
            zip.file(`${baseName}_${safeAnnotator}_${ts}_完整版.json`, JSON.stringify(fullData, null, 2));

            // 2. 生成修改补丁 (纯数组，兼容结构修改)
            const modifiedConvIndices = new Set([
                ...[...state.edits.keys()].map(k => Number(k.split(':')[0])),
                ...state.structuralEdits.keys()
            ]);

            const changesData = [];
            modifiedConvIndices.forEach((ci) => {
                if (ci < 0 || ci >= state.data.length) return;
                const conv = JSON.parse(JSON.stringify(state.data[ci]));

                // 若有结构修改，直接使用新的 messages 并清理标记
                if (state.structuralEdits.has(ci)) {
                    conv.messages = cleanForExport(state.structuralEdits.get(ci));
                }

                // 应用该会话的文本修改
                state.edits.forEach((content, key) => {
                    const [editCi, editMi] = key.split(':').map(Number);
                    if (editCi === ci && editMi >= 0 && editMi < conv.messages.length) {
                        conv.messages[editMi].content = content;
                    }
                });
                changesData.push(conv);
            });

            zip.file(`${baseName}_${safeAnnotator}_${ts}_补丁.json`, JSON.stringify(changesData, null, 2));

            // 打包下载
            try {
                const blob = await zip.generateAsync({ type: "blob" });
                triggerDownload(blob, zipName);
                resetAfterExport();
                alert(`✅ 成功交卷！\n\n系统已为您打包下载压缩包：\n${zipName}\n\n请将这个压缩包发给组长（或放入共享文件夹）。\n\n[提示] 交卷后，当前的修改痕迹已清空。`);
            } catch (err) {
                alert('打包失败：' + err.message);
            }
        }

        // =========================================================
        // 合并工具模块 (纯粹拼接与去重)
        // =========================================================
        const mergeState = { patchFiles: [] };

        function resetMergeModal() {
            mergeState.patchFiles = [];
            $('mergePatchesCount').textContent = '已选 0 个';
            $('mergeToolLog').style.display = 'none';
            $('btnMergeDo').disabled = true;
        }

        $('btnMergeTool').addEventListener('click', () => {
            resetMergeModal();
            $('mergeToolModal').hidden = false;
        });
        $('mergeToolCancel').addEventListener('click', () => { $('mergeToolModal').hidden = true; });

        $('btnMergeSelectPatches').addEventListener('click', () => $('mergePatchesInput').click());
        $('mergePatchesInput').addEventListener('change', e => {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            mergeState.patchFiles.push(...files);
            $('mergePatchesCount').textContent = `已选 ${mergeState.patchFiles.length} 个`;
            $('btnMergeDo').disabled = false;
            e.target.value = '';
        });

        $('btnMergeDo').addEventListener('click', async () => {
            if (!mergeState.patchFiles.length) return;

            $('btnMergeDo').disabled = true;
            const logBox = $('mergeToolLog');
            logBox.style.display = 'block';
            logBox.innerHTML = '开始解析文件...';

            const isDedup = $('mergeDedup').checked;
            let mergedArray = [];

            for (const file of mergeState.patchFiles) {
                try {
                    let fileArrays = [];

                    if (file.name.endsWith('.zip')) {
                        logBox.innerHTML += `<br>解压 ${file.name}...`;
                        const zip = await JSZip.loadAsync(file);
                        const jsonFiles = Object.keys(zip.files).filter(name => name.endsWith('.json') && (name.includes('补丁') || name.includes('patch')));

                        if (jsonFiles.length === 0) {
                            logBox.innerHTML += `<br><span style="color:#b45309;">跳过：压缩包内未找到补丁文件</span>`;
                            continue;
                        }

                        for (const jName of jsonFiles) {
                            const text = await zip.files[jName].async('string');
                            const data = JSON.parse(text);
                            fileArrays.push(Array.isArray(data) ? data : (data.conversations || []));
                        }
                    } else if (file.name.endsWith('.json')) {
                        logBox.innerHTML += `<br>读取 ${file.name}...`;
                        const text = await file.text();
                        const data = JSON.parse(text);
                        fileArrays.push(Array.isArray(data) ? data : (data.conversations || []));
                    }

                    for (const arr of fileArrays) {
                        if (Array.isArray(arr)) {
                            mergedArray = mergedArray.concat(arr);
                        }
                    }
                } catch (err) {
                    logBox.innerHTML += `<br><span style="color:#b91c1c;">错误：${file.name} 解析失败 (${err.message})</span>`;
                }
            }

            const originalCount = mergedArray.length;
            if (isDedup) {
                logBox.innerHTML += `<br>正在去重...`;
                const seen = new Set();
                const uniqueArray = [];
                for (const item of mergedArray) {
                    const str = JSON.stringify(item);
                    if (!seen.has(str)) {
                        seen.add(str);
                        uniqueArray.push(item);
                    }
                }
                mergedArray = uniqueArray;
                logBox.innerHTML += `<br>去重完成，移除了 ${originalCount - mergedArray.length} 条重复数据。`;
            }

            const d = new Date();
            const p2 = n => String(n).padStart(2, '0');
            const ts = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
            const outName = `合并补丁_${mergedArray.length}条_${ts}.json`;

            const blob = new Blob([JSON.stringify(mergedArray, null, 2)], { type: 'application/json' });
            triggerDownload(blob, outName);

            logBox.innerHTML += `<br><br><b>✅ 合并完成！</b><br>共拼接了 ${originalCount} 条会话，最终保留 ${mergedArray.length} 条。<br>文件已下载。`;
            $('btnMergeDo').disabled = false;
        });

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // ----- 绑定全局事件 -----
        $('convList').addEventListener('click', e => {
            const item = e.target.closest('.conv-item');
            if (item) selectConv(Number(item.dataset.ci));
        });
        $('btnAnnotator').addEventListener('click', () => openAnnotatorModal(null));
        updateAnnotatorUI();
        $('filter').addEventListener('change', renderSidebar);

        $('btnOpen').addEventListener('click', () => $('fileInput').click());
        $('fileInput').addEventListener('change', e => {
            const f = e.target.files[0];
            if (!f) return;
            $('progressText').textContent = `正在加载 ${f.name}...`;
            const reader = new FileReader();
            reader.onload = () => {
                try { loadData(JSON.parse(reader.result), f.name); }
                catch (err) { alert('文件不是合法 JSON：' + err.message); updateProgress(); }
            };
            reader.readAsText(f);
            e.target.value = '';
        });

        $('btnExportZip').addEventListener('click', triggerExportZip);

        window.addEventListener('beforeunload', () => {
            if (state.data && (state.edits.size > 0 || state.structuralEdits.size > 0)) {
                localStorage.setItem(storageKey(), JSON.stringify({
                    edits: [...state.edits],
                    structuralEdits: [...state.structuralEdits]
                }));
            }
        });
    </script>
</body>

</html>
